<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô hình 3D - Tên điểm chỉ là chữ cái</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #f0f0f0;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }
        /* --- CSS được cập nhật cho tên điểm --- */
        .label {
            position: absolute;
            font-size: 18px; /* Tăng nhẹ kích thước chữ */
            color: #000000;
            font-weight: bold;
            pointer-events: none;
            transform: translate(-50%, -50%);
            /* Thêm viền trắng mờ để chữ luôn nổi bật */
            text-shadow: 0px 0px 4px #FFFFFF, 0px 0px 4px #FFFFFF, 0px 0px 4px #FFFFFF;
            /* Loại bỏ nền, đệm và bóng */
            background-color: transparent;
            padding: 0;
            border-radius: 0;
            box-shadow: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <script>
        let scene, camera, renderer, controls;
        let labels = {};

        const A = new THREE.Vector3(0, 0, 0);
        const D = new THREE.Vector3(0, 10, 0);
        const M = new THREE.Vector3(8, 0, 0);
        const B = new THREE.Vector3(8, 0, -4);
        const C = new THREE.Vector3(8, 0, 4);

        const pointMaterial = new THREE.MeshBasicMaterial({ color: 0x333333 });
        
        const occlusionMaterial = new THREE.MeshPhongMaterial({
            color: 0xFFFFFF,
            side: THREE.DoubleSide,
            colorWrite: false,
            depthWrite: true
        });
        
        const hiddenDashedLineMaterial = new THREE.LineDashedMaterial({
            color: 0x444444,
            linewidth: 5,
            dashSize: 1,
            gapSize: 1,
            depthWrite: false,
            depthFunc: THREE.GreaterEqualDepth
        });

        const visibleSolidLineMaterial = new THREE.LineBasicMaterial({
            color: 0x000000,
            linewidth: 7,
            depthFunc: THREE.LessEqualDepth
        });

        const visibleBoldLineMaterial = new THREE.LineBasicMaterial({
            color: 0x000000,
            linewidth: 15,
            depthFunc: THREE.LessEqualDepth
        });

        function addLabel(position, text) {
            const element = document.createElement('div');
            element.className = 'label';
            element.textContent = text;
            document.body.appendChild(element);
            labels[text] = { element: element, position: position };
        }

        function createPointSphere(position, labelText) {
            const geometry = new THREE.SphereGeometry(0.3, 16, 16);
            const sphere = new THREE.Mesh(geometry, pointMaterial);
            sphere.position.copy(position);
            scene.add(sphere);
            addLabel(position, labelText);
        }

        function addEdge(v1, v2, isBold = false) {
            const points = [v1, v2];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);

            const dashedLine = new THREE.Line(geometry, hiddenDashedLineMaterial);
            dashedLine.computeLineDistances();
            dashedLine.renderOrder = 1;
            scene.add(dashedLine);
            
            const solidMaterial = isBold ? visibleBoldLineMaterial : visibleSolidLineMaterial;
            const solidLine = new THREE.Line(geometry, solidMaterial);
            solidLine.renderOrder = 2;
            scene.add(solidLine);
        }
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(10, 15, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(5, 5, 0);

            scene.add(new THREE.AmbientLight(0xcccccc));
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7.5);
            scene.add(directionalLight);

            // Occlusion Geometry
            const facesGeometry = new THREE.BufferGeometry();
            const vertices = new Float32Array([
                A.x, A.y, A.z,   B.x, B.y, B.z,   C.x, C.y, C.z,
                D.x, D.y, D.z,   A.x, A.y, A.z,   B.x, B.y, B.z,
                D.x, D.y, D.z,   A.x, A.y, A.z,   C.x, C.y, C.z,
                D.x, D.y, D.z,   B.x, B.y, B.z,   C.x, C.y, C.z
            ]);
            facesGeometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            facesGeometry.computeVertexNormals();
            
            const occlusionMesh = new THREE.Mesh(facesGeometry, occlusionMaterial);
            occlusionMesh.renderOrder = 0;
            scene.add(occlusionMesh);


            // Visible Geometry
            createPointSphere(A, 'A');
            createPointSphere(B, 'B');
            createPointSphere(C, 'C');
            createPointSphere(D, 'D');
            createPointSphere(M, 'M');

            addEdge(B, C, true);
            addEdge(D, A, true);
            addEdge(A, M, true);
            addEdge(D, M, true);
            
            addEdge(A, B, false);
            addEdge(A, C, false);
            addEdge(D, B, false);
            addEdge(D, C, false);
        }

        function updateLabels() {
            for (const key in labels) {
                const label = labels[key];
                const vector = label.position.clone().project(camera);
                const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-vector.y * 0.5 + 0.5) * window.innerHeight;
                label.element.style.left = `${x}px`;
                label.element.style.top = `${y}px`;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateLabels();
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
        animate();
        window.addEventListener('resize', onWindowResize);
    </script>
</body>
</html>
