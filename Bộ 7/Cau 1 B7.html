<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô hình 3D: Tứ diện vuông OABC (Đã sửa lỗi)</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #f0f0f0; }
        canvas { display: block; width: 100%; height: 100vh; }
        .label {
            position: absolute;
            font-size: 18px;
            color: #000000;
            font-weight: bold;
            pointer-events: none;
            transform: translate(-50%, -50%);
            text-shadow: 0px 0px 4px #FFFFFF, 0px 0px 4px #FFFFFF, 0px 0px 4px #FFFFFF;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <script>
        let scene, camera, renderer, controls;
        let labels = {};

        // --- 1. Define Coordinates ---
        const oa = 8, ob = 10, oc = 12;
        const O = new THREE.Vector3(0, 0, 0);
        const A = new THREE.Vector3(oa, 0, 0);
        const B = new THREE.Vector3(0, ob, 0);
        const C = new THREE.Vector3(0, 0, oc);
        const t = 1 / (1/(oa*oa) + 1/(ob*ob) + 1/(oc*oc));
        const H = new THREE.Vector3(t/oa, t/ob, t/oc);

        // --- 2. Materials ---
        const pointMaterial = new THREE.MeshBasicMaterial({ color: 0x333333 });
        // Vật liệu vô hình để che khuất các đường nét
        const occlusionMaterial = new THREE.MeshPhongMaterial({ color: 0xFFFFFF, side: THREE.DoubleSide, colorWrite: false, depthWrite: true });
        
        // Vật liệu cho nét đứt và nét liền
        const hiddenDashedLineMaterial = new THREE.LineDashedMaterial({ color: 0x444444, linewidth: 5, dashSize: 1, gapSize: 1, depthWrite: false, depthFunc: THREE.GreaterEqualDepth });
        const visibleSolidLineMaterial = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 7, depthFunc: THREE.LessEqualDepth });
        const visibleRedBoldLineMaterial = new THREE.LineBasicMaterial({ color: 0xFF0000, linewidth: 15, depthFunc: THREE.LessEqualDepth });
        const visibleBlueBoldLineMaterial = new THREE.LineBasicMaterial({ color: 0x0000FF, linewidth: 12, depthFunc: THREE.LessEqualDepth });

        // --- Helper Functions ---
        function addLabel(position, text) {
            const element = document.createElement('div');
            element.className = 'label';
            element.textContent = text;
            document.body.appendChild(element);
            labels[text] = { element: element, position: position };
        }

        function createPointSphere(position, labelText) {
            const geometry = new THREE.SphereGeometry(0.25, 16, 16);
            const sphere = new THREE.Mesh(geometry, pointMaterial);
            sphere.position.copy(position);
            scene.add(sphere);
            addLabel(position, labelText);
        }

        // --- SỬA LỖI: Sử dụng lại hàm addEdge 2 lớp ---
        function addEdge(v1, v2, material) {
            const points = [v1, v2];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            
            // Lớp nét đứt (hiển thị khi bị che)
            const dashedLine = new THREE.Line(geometry, hiddenDashedLineMaterial);
            dashedLine.computeLineDistances();
            dashedLine.renderOrder = 1;
            scene.add(dashedLine);
            
            // Lớp nét liền (hiển thị khi thấy)
            const solidLine = new THREE.Line(geometry, material);
            solidLine.renderOrder = 2;
            scene.add(solidLine);
        }
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(12, 12, 15);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(oa/3, ob/3, oc/3);
            scene.add(new THREE.AmbientLight(0xcccccc));
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7.5);
            scene.add(directionalLight);

            // --- SỬA LỖI: Thêm các mặt phẳng vô hình để che khuất ---
            const facesGeometry = new THREE.BufferGeometry();
            const vertices = new Float32Array([
                // 4 mặt của tứ diện
                O.x, O.y, O.z,   A.x, A.y, A.z,   B.x, B.y, B.z,
                O.x, O.y, O.z,   B.x, B.y, B.z,   C.x, C.y, C.z,
                O.x, O.y, O.z,   C.x, C.y, C.z,   A.x, A.y, A.z,
                A.x, A.y, A.z,   B.x, B.y, B.z,   C.x, C.y, C.z
            ]);
            facesGeometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            facesGeometry.computeVertexNormals();
            const occlusionMesh = new THREE.Mesh(facesGeometry, occlusionMaterial);
            occlusionMesh.renderOrder = 0;
            scene.add(occlusionMesh);
            
            // --- Visible Geometry ---
            createPointSphere(O, 'O');
            createPointSphere(A, 'A');
            createPointSphere(B, 'B');
            createPointSphere(C, 'C');
            createPointSphere(H, 'H');

            // --- SỬA LỖI: Vẽ tất cả các cạnh bằng hàm addEdge mới ---
            // Tetrahedron edges
            addEdge(O, A, visibleSolidLineMaterial);
            addEdge(O, B, visibleSolidLineMaterial);
            addEdge(O, C, visibleSolidLineMaterial);
            addEdge(A, B, visibleSolidLineMaterial);
            addEdge(B, C, visibleSolidLineMaterial);
            addEdge(C, A, visibleSolidLineMaterial);
            
            // Highlighted altitudes
            addEdge(O, H, visibleRedBoldLineMaterial); 
            addEdge(A, H, visibleBlueBoldLineMaterial); 
            addEdge(B, H, visibleBlueBoldLineMaterial); 
            addEdge(C, H, visibleBlueBoldLineMaterial); 
        }

        function updateLabels() {
            for (const key in labels) {
                const label = labels[key];
                const vector = label.position.clone().project(camera);
                const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-vector.y * 0.5 + 0.5) * window.innerHeight;
                label.element.style.left = `${x}px`;
                label.element.style.top = `${y}px`;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateLabels();
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
        animate();
        window.addEventListener('resize', onWindowResize);
    </script>
</body>
</html>
