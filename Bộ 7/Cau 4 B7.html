<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô hình 3D: Hai mặt phẳng song song (Đã sửa)</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #f0f0f0; }
        canvas { display: block; width: 100%; height: 100vh; }
        .label {
            position: absolute;
            font-size: 18px;
            color: #000000;
            font-weight: bold;
            pointer-events: none;
            transform: translate(-50%, -50%);
            text-shadow: 0px 0px 4px #FFFFFF, 0px 0px 4px #FFFFFF, 0px 0px 4px #FFFFFF;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <script>
        let scene, camera, renderer, controls;
        let labels = {};

        // --- 1. Define Coordinates (Oblique parallelepiped) ---
        const A = new THREE.Vector3(0, 0, 0);
        const D = new THREE.Vector3(0, 10, 0);
        const B = new THREE.Vector3(12, 0, 0);
        const A_ = new THREE.Vector3(4, 4, 10);

        const C = new THREE.Vector3().addVectors(B, D);
        const B_ = new THREE.Vector3().addVectors(B, A_);
        const D_ = new THREE.Vector3().addVectors(D, A_);
        const C_ = new THREE.Vector3().addVectors(C, A_);

        // --- 2. Materials ---
        const pointMaterial = new THREE.MeshBasicMaterial({ color: 0x333333 });
        const occlusionMaterial = new THREE.MeshPhongMaterial({ color: 0xFFFFFF, side: THREE.DoubleSide, colorWrite: false, depthWrite: true });
        const plane1Material = new THREE.MeshPhongMaterial({ color: 0x4169E1, side: THREE.DoubleSide, opacity: 0.3, transparent: true }); // Blue
        const plane2Material = new THREE.MeshPhongMaterial({ color: 0x2E8B57, side: THREE.DoubleSide, opacity: 0.3, transparent: true }); // Green
        const hiddenDashedLineMaterial = new THREE.LineDashedMaterial({ color: 0x444444, linewidth: 5, dashSize: 1, gapSize: 1, depthWrite: false, depthFunc: THREE.GreaterEqualDepth });
        
        const visibleSolidLineMaterial = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 7, depthFunc: THREE.LessEqualDepth });
        const visibleRedBoldLineMaterial = new THREE.LineBasicMaterial({ color: 0xFF0000, linewidth: 15, depthFunc: THREE.LessEqualDepth });
        const visiblePurpleBoldLineMaterial = new THREE.LineBasicMaterial({ color: 0x800080, linewidth: 15, depthFunc: THREE.LessEqualDepth });

        // --- Helper Functions ---
        function addLabel(position, text) {
            const element = document.createElement('div');
            element.className = 'label';
            element.textContent = text;
            document.body.appendChild(element);
            labels[text] = { element: element, position: position };
        }

        function createPointSphere(position, labelText) {
            const geometry = new THREE.SphereGeometry(0.3, 16, 16);
            const sphere = new THREE.Mesh(geometry, pointMaterial);
            sphere.position.copy(position);
            scene.add(sphere);
            addLabel(position, labelText);
        }

        function addEdge(v1, v2, material) {
            const points = [v1, v2];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const dashedLine = new THREE.Line(geometry, hiddenDashedLineMaterial);
            dashedLine.computeLineDistances();
            dashedLine.renderOrder = 2;
            scene.add(dashedLine);
            const solidLine = new THREE.Line(geometry, material);
            solidLine.renderOrder = 3;
            scene.add(solidLine);
        }
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(20, 15, 25);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(8, 7, 5);
            scene.add(new THREE.AmbientLight(0xcccccc));
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7.5);
            scene.add(directionalLight);

            // --- Occlusion Geometry ---
            const occlusionGeom = new THREE.BufferGeometry();
            occlusionGeom.setFromPoints([A,B,C,D,A_,B_,C_,D_]);
            occlusionGeom.setIndex([
                0,1,2, 0,2,3, 4,6,5, 4,7,6, 0,4,5, 0,5,1, 1,5,6, 1,6,2,
                2,6,7, 2,7,3, 3,7,4, 3,4,0
            ]);
            occlusionGeom.computeVertexNormals();
            const occlusionMesh = new THREE.Mesh(occlusionGeom, occlusionMaterial);
            occlusionMesh.renderOrder = 0;
            scene.add(occlusionMesh);

            // --- Highlighted Planes ---
            const plane1Geom = new THREE.BufferGeometry().setFromPoints([B, D, A_]);
            const plane1Mesh = new THREE.Mesh(plane1Geom, plane1Material);
            plane1Mesh.renderOrder = 1;
            scene.add(plane1Mesh);
            
            const plane2Geom = new THREE.BufferGeometry().setFromPoints([B_, D_, C]);
            const plane2Mesh = new THREE.Mesh(plane2Geom, plane2Material);
            plane2Mesh.renderOrder = 1;
            scene.add(plane2Mesh);
            
            // --- Visible Geometry ---
            // SỬA LỖI: Gọi tên điểm một cách tường minh
            createPointSphere(A, 'A');
            createPointSphere(B, 'B');
            createPointSphere(C, 'C');
            createPointSphere(D, 'D');
            createPointSphere(A_, "A'");
            createPointSphere(B_, "B'");
            createPointSphere(C_, "C'");
            createPointSphere(D_, "D'");
            
            // Highlighted parallel lines
            addEdge(B, D, visibleRedBoldLineMaterial);
            addEdge(B_, D_, visibleRedBoldLineMaterial);
            addEdge(A_, D, visiblePurpleBoldLineMaterial);
            addEdge(B_, C, visiblePurpleBoldLineMaterial);
            
            // Box edges
            addEdge(A, B, visibleSolidLineMaterial);
            addEdge(A, D, visibleSolidLineMaterial);
            addEdge(C, B, visibleSolidLineMaterial);
            addEdge(C, D, visibleSolidLineMaterial);
            addEdge(A_, B_, visibleSolidLineMaterial);
            addEdge(A_, D_, visibleSolidLineMaterial);
            addEdge(C_, B_, visibleSolidLineMaterial);
            addEdge(C_, D_, visibleSolidLineMaterial);
            addEdge(A, A_, visibleSolidLineMaterial);
            addEdge(B, B_, visibleSolidLineMaterial);
            addEdge(C, C_, visibleSolidLineMaterial);
            addEdge(D, D_, visibleSolidLineMaterial);
        }

        function updateLabels() {
            for (const key in labels) {
                const label = labels[key];
                const vector = label.position.clone().project(camera);
                const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-vector.y * 0.5 + 0.5) * window.innerHeight;
                label.element.style.left = `${x}px`;
                label.element.style.top = `${y}px`;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateLabels();
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
        animate();
        window.addEventListener('resize', onWindowResize);
    </script>
</body>
</html>
