<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô hình 3D: Thiết diện IJKL</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #f0f0f0; }
        canvas { display: block; width: 100%; height: 100vh; }
        .label {
            position: absolute;
            font-size: 16px;
            color: #000000;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.75);
            padding: 2px 6px;
            border-radius: 5px;
            pointer-events: none;
            transform: translate(-50%, -50%);
            white-space: nowrap;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <script>
        let scene, camera, renderer, controls;
        let labels = {};

        // --- 1. Define Coordinates (General Tetrahedron) ---
        const B = new THREE.Vector3(0, 0, 0);
        const C = new THREE.Vector3(12, 2, 0);
        const D = new THREE.Vector3(4, 10, 0);
        const A = new THREE.Vector3(5, 4, 15);

        // I, J are midpoints
        const I = new THREE.Vector3().addVectors(A, C).multiplyScalar(0.5);
        const J = new THREE.Vector3().addVectors(B, C).multiplyScalar(0.5);
        // K on BD with BK = 2KD => K = (1*B + 2*D)/3
        const K = new THREE.Vector3().add(B).add(D.clone().multiplyScalar(2)).multiplyScalar(1/3);
        // E = CD ∩ JK. From EC/ED = 2, D is the midpoint of CE. E = 2D - C.
        const E = new THREE.Vector3().add(D).multiplyScalar(2).sub(C);
        // L is intersection of IE and AD. L = (1/3)A + (2/3)D
        const L = new THREE.Vector3().add(A).add(D.clone().multiplyScalar(2)).multiplyScalar(1/3);

        // --- 2. Materials ---
        const pointMaterial = new THREE.MeshBasicMaterial({ color: 0x333333 });
        const occlusionMaterial = new THREE.MeshPhongMaterial({ color: 0xFFFFFF, side: THREE.DoubleSide, colorWrite: false, depthWrite: true });
        const hiddenDashedLineMaterial = new THREE.LineDashedMaterial({ color: 0xAAAAAA, linewidth: 2, dashSize: 0.5, gapSize: 0.25, depthWrite: false, depthFunc: THREE.GreaterEqualDepth });
        
        const visibleSolidLineMaterial = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 7, depthFunc: THREE.LessEqualDepth });
        const visibleRedBoldLineMaterial = new THREE.LineBasicMaterial({ color: 0xFF0000, linewidth: 15, depthFunc: THREE.LessEqualDepth }); // Red bold for cross-section
        const constructionLineMaterial = new THREE.LineBasicMaterial({ color: 0x888888, linewidth: 3, depthFunc: THREE.LessEqualDepth }); // Gray for construction lines

        // --- Helper Functions ---
        function addLabel(position, text) {
            const element = document.createElement('div');
            element.className = 'label';
            element.textContent = text;
            document.body.appendChild(element);
            labels[text] = { element: element, position: position };
        }

        function createPointSphere(position, labelText) {
            const geometry = new THREE.SphereGeometry(0.3, 16, 16);
            const sphere = new THREE.Mesh(geometry, pointMaterial);
            sphere.position.copy(position);
            scene.add(sphere);
            addLabel(position, labelText);
        }

        function addEdge(v1, v2, material) {
            const points = [v1, v2];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const dashedLine = new THREE.Line(geometry, hiddenDashedLineMaterial);
            dashedLine.computeLineDistances();
            dashedLine.renderOrder = 1;
            scene.add(dashedLine);
            const solidLine = new THREE.Line(geometry, material);
            solidLine.renderOrder = 2;
            scene.add(solidLine);
        }
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(15, 12, 20);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(6, 5, 5);
            scene.add(new THREE.AmbientLight(0xcccccc));
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7.5);
            scene.add(directionalLight);

            // --- Occlusion Geometry ---
            const facesGeometry = new THREE.BufferGeometry();
            const vertices = new Float32Array([
                A.x, A.y, A.z,   B.x, B.y, B.z,   C.x, C.y, C.z,
                A.x, A.y, A.z,   C.x, C.y, C.z,   D.x, D.y, D.z,
                A.x, A.y, A.z,   B.x, B.y, B.z,   D.x, D.y, D.z,
                B.x, B.y, B.z,   C.x, C.y, C.z,   D.x, D.y, D.z
            ]);
            facesGeometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            facesGeometry.computeVertexNormals();
            const occlusionMesh = new THREE.Mesh(facesGeometry, occlusionMaterial);
            occlusionMesh.renderOrder = 0;
            scene.add(occlusionMesh);
            
            // --- Visible Geometry ---
            createPointSphere(A, 'A');
            createPointSphere(B, 'B');
            createPointSphere(C, 'C');
            createPointSphere(D, 'D');
            createPointSphere(I, 'I');
            createPointSphere(J, 'J');
            createPointSphere(K, 'K');
            createPointSphere(L, 'L');
            createPointSphere(E, 'E');

            // Cross-section edges (red)
            addEdge(I, J, visibleRedBoldLineMaterial);
            addEdge(J, K, visibleRedBoldLineMaterial);
            addEdge(K, L, visibleRedBoldLineMaterial);
            addEdge(L, I, visibleRedBoldLineMaterial);
            
            // Tetrahedron edges (black)
            addEdge(A, B, visibleSolidLineMaterial);
            addEdge(A, C, visibleSolidLineMaterial);
            addEdge(A, D, visibleSolidLineMaterial);
            addEdge(B, C, visibleSolidLineMaterial);
            addEdge(B, D, visibleSolidLineMaterial);
            addEdge(C, D, visibleSolidLineMaterial);

            // Construction lines (gray)
            addEdge(K, E, constructionLineMaterial);
            addEdge(D, E, constructionLineMaterial);
        }

        function updateLabels() {
            for (const key in labels) {
                const label = labels[key];
                const vector = label.position.clone().project(camera);
                const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-vector.y * 0.5 + 0.5) * window.innerHeight;
                label.element.style.left = `${x}px`;
                label.element.style.top = `${y}px`;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateLabels();
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
        animate();
        window.addEventListener('resize', onWindowResize);
    </script>
</body>
</html>
