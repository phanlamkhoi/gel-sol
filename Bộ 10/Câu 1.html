<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minh Họa Hình Nón và Khối Cầu</title>
    
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Ẩn thanh cuộn */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f0f0;
        }

        canvas {
            display: block; /* Loại bỏ khoảng trống dưới canvas */
        }

        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 12px 15px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border-radius: 8px;
            max-width: 300px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            font-size: 14px;
        }
        #info h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 18px;
        }
        #info p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div id="info">
        <h3>Bài toán Hình nón & Khối cầu 💡</h3>
        <p><b>Bình nón:</b> Chiều cao (h) = 6, Bán kính đáy (r) = 6</p>
        <p><b>Khối cầu:</b> Bán kính (R) = 3</p>
        <p><i>Dùng chuột để xoay và cuộn để phóng to/thu nhỏ.</i></p>
    </div>
    
    <canvas id="renderCanvas"></canvas>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Thiết lập cơ bản
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeeeeee);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ 
            canvas: document.getElementById('renderCanvas'),
            antialias: true 
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true; // Bật đổ bóng

        // 2. Thiết lập điều khiển camera
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // Tạo hiệu ứng mượt mà khi xoay
        controls.dampingFactor = 0.05;
        camera.position.set(10, 10, 15);
        controls.update();

        // 3. Thêm ánh sáng
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.8);
        directionalLight.position.set(8, 12, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        // 4. Tạo các đối tượng hình học

        // --- Hình nón ---
        const coneHeight = 6;
        const coneRadius = 6;
        const coneGeometry = new THREE.ConeGeometry(coneRadius, coneHeight, 64);
        const coneMaterial = new THREE.MeshPhongMaterial({
            color: 0x0077ff,
            transparent: true,
            opacity: 0.35,
            side: THREE.DoubleSide
        });
        const cone = new THREE.Mesh(coneGeometry, coneMaterial);
        cone.position.y = coneHeight / 2; // Dịch chuyển để đáy nằm trên mặt phẳng xz
        scene.add(cone);

        // --- Khung dây cho hình nón ---
        const wireframe = new THREE.LineSegments(
            new THREE.EdgesGeometry(coneGeometry),
            new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 })
        );
        wireframe.position.copy(cone.position);
        scene.add(wireframe);

        // --- Khối cầu ---
        const sphereRadius = 3;
        const sphereGeometry = new THREE.SphereGeometry(sphereRadius, 64, 64);
        const sphereMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xffd700,
            metalness: 0.3,
            roughness: 0.4
        });
        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        sphere.position.y = 0; // Tâm khối cầu nằm tại mặt nước (gốc tọa độ)
        sphere.castShadow = true;
        scene.add(sphere);

        // --- Mặt nước ---
        const waterGeometry = new THREE.PlaneGeometry(coneRadius * 2.5, coneRadius * 2.5);
        const waterMaterial = new THREE.MeshPhongMaterial({
            color: 0x66ccff,
            transparent: true,
            opacity: 0.7,
            side: THREE.DoubleSide
        });
        const waterPlane = new THREE.Mesh(waterGeometry, waterMaterial);
        waterPlane.rotation.x = -Math.PI / 2; // Xoay mặt phẳng nằm ngang
        waterPlane.position.y = 0;
        waterPlane.receiveShadow = true;
        scene.add(waterPlane);

        // 5. Vòng lặp render
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // Cập nhật điều khiển
            renderer.render(scene, camera);
        }

        // 6. Xử lý khi thay đổi kích thước cửa sổ
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
