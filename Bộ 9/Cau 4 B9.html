<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô hình 3D: Khoảng cách giữa AD và SB</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #f0f0f0; }
        canvas { display: block; width: 100%; height: 100vh; }
        .label {
            position: absolute;
            font-size: 16px;
            color: #000000;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.75);
            padding: 2px 6px;
            border-radius: 5px;
            pointer-events: none;
            transform: translate(-50%, -50%);
            white-space: nowrap;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <script>
        let scene, camera, renderer, controls;
        let labels = {};

        // --- 1. Define Coordinates (a = 10, angle DAB = 60 deg) ---
        const a = 10;
        const so = 3 * a / 4;

        const O = new THREE.Vector3(0, 0, 0);
        const S = new THREE.Vector3(0, 0, so);
        const A = new THREE.Vector3(a * Math.sqrt(3) / 2, 0, 0);
        const C = new THREE.Vector3(-a * Math.sqrt(3) / 2, 0, 0);
        const B = new THREE.Vector3(0, a / 2, 0);
        const D = new THREE.Vector3(0, -a / 2, 0);

        // K is foot of perpendicular from O to BC.
        const lineBC = new THREE.Line3(B, C);
        const K = new THREE.Vector3();
        lineBC.closestPointToPoint(O, true, K);
        
        // H is foot of perpendicular from O to SK
        const lineSK = new THREE.Line3(S, K);
        const H = new THREE.Vector3();
        lineSK.closestPointToPoint(O, true, H);

        // --- 2. Materials ---
        const pointMaterial = new THREE.MeshBasicMaterial({ color: 0x333333 });
        const occlusionMaterial = new THREE.MeshPhongMaterial({ color: 0xFFFFFF, side: THREE.DoubleSide, colorWrite: false, depthWrite: true });
        const planeMaterial = new THREE.MeshPhongMaterial({ color: 0x4169E1, side: THREE.DoubleSide, opacity: 0.3, transparent: true });
        const hiddenDashedLineMaterial = new THREE.LineDashedMaterial({ color: 0x444444, linewidth: 5, dashSize: 1, gapSize: 1, depthWrite: false, depthFunc: THREE.GreaterEqualDepth });
        
        const visibleSolidLineMaterial = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 7, depthFunc: THREE.LessEqualDepth });
        const visibleRedBoldLineMaterial = new THREE.LineBasicMaterial({ color: 0xFF0000, linewidth: 15, depthFunc: THREE.LessEqualDepth });
        const visiblePurpleBoldLineMaterial = new THREE.LineBasicMaterial({ color: 0x800080, linewidth: 15, depthFunc: THREE.LessEqualDepth });

        // --- Helper Functions ---
        function addLabel(position, text) {
            const element = document.createElement('div');
            element.className = 'label';
            element.textContent = text;
            document.body.appendChild(element);
            labels[text] = { element: element, position: position };
        }

        function createPointSphere(position, labelText) {
            const geometry = new THREE.SphereGeometry(0.3, 16, 16);
            const sphere = new THREE.Mesh(geometry, pointMaterial);
            sphere.position.copy(position);
            scene.add(sphere);
            addLabel(position, labelText);
        }

        function addEdge(v1, v2, material) {
            const points = [v1, v2];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const dashedLine = new THREE.Line(geometry, hiddenDashedLineMaterial);
            dashedLine.computeLineDistances();
            dashedLine.renderOrder = 2;
            scene.add(dashedLine);
            const solidLine = new THREE.Line(geometry, material);
            solidLine.renderOrder = 3;
            scene.add(solidLine);
        }
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(20, -15, 18);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0, 0, so/3);
            scene.add(new THREE.AmbientLight(0xcccccc));
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7.5);
            scene.add(directionalLight);

            // --- Occlusion Geometry ---
            const occlusionGeom = new THREE.BufferGeometry();
            occlusionGeom.setFromPoints([A,B,C,D,S]);
            occlusionGeom.setIndex([0,1,2, 0,2,3, 0,1,4, 1,2,4, 2,3,4, 3,0,4]);
            occlusionGeom.computeVertexNormals();
            const occlusionMesh = new THREE.Mesh(occlusionGeom, occlusionMaterial);
            occlusionMesh.renderOrder = 0;
            scene.add(occlusionMesh);

            // Highlighted Plane (SBC)
            const planeGeom = new THREE.BufferGeometry().setFromPoints([S, B, C]);
            const planeMesh = new THREE.Mesh(planeGeom, planeMaterial);
            planeMesh.renderOrder = 1;
            scene.add(planeMesh);
            
            // --- Visible Geometry ---
            createPointSphere(S, 'S');
            createPointSphere(A, 'A');
            createPointSphere(B, 'B');
            createPointSphere(C, 'C');
            createPointSphere(D, 'D');
            createPointSphere(O, 'O');
            createPointSphere(K, 'K');
            createPointSphere(H, 'H');

            // Highlighted skew lines
            addEdge(A, D, visibleRedBoldLineMaterial);
            addEdge(S, B, visibleRedBoldLineMaterial);

            // Distance from O to (SBC) (OH)
            addEdge(O, H, visiblePurpleBoldLineMaterial);

            // Pyramid edges & construction lines
            addEdge(S, A, visibleSolidLineMaterial);
            addEdge(S, C, visibleSolidLineMaterial);
            addEdge(S, D, visibleSolidLineMaterial);
            addEdge(A, B, visibleSolidLineMaterial);
            addEdge(B, C, visibleSolidLineMaterial);
            addEdge(C, D, visibleSolidLineMaterial);
            addEdge(D, A, visibleSolidLineMaterial);
            addEdge(S, O, visibleSolidLineMaterial);
            addEdge(O, K, visibleSolidLineMaterial);
            addEdge(S, K, visibleSolidLineMaterial);
        }

        function updateLabels() {
            for (const key in labels) {
                const label = labels[key];
                const vector = label.position.clone().project(camera);
                const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-vector.y * 0.5 + 0.5) * window.innerHeight;
                label.element.style.left = `${x}px`;
                label.element.style.top = `${y}px`;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateLabels();
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
        animate();
        window.addEventListener('resize', onWindowResize);
    </script>
</body>
</html>
