    /* --- js/utils.js --- */
    const Utils = {
        showScreen: function(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        },
        shuffleArray: function(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        },
        shuffleAndPickN: function(arr, n) {
            return Utils.shuffleArray([...arr]).slice(0, n);
        },
        showNotification: function(title, message, customClass = '') {
            const overlay = document.getElementById('notification-overlay');
            const box = overlay.querySelector('.notification-box');
            const messageEl = document.getElementById('notification-message');
            const resetBtn = document.getElementById('reset-view-btn');
            const nextHintBtn = document.getElementById('next-hint-btn');

            // --- Reset state from previous calls ---
            box.className = 'notification-box';
            if (customClass) box.classList.add(customClass);
            resetBtn.style.display = 'none';
            resetBtn.onclick = null;
            nextHintBtn.style.display = 'none';
            nextHintBtn.onclick = null; // Important: clear previous listener
            // --- End Reset ---

            document.getElementById('notification-title').textContent = title;

            // --- Main Logic for Hints vs. Regular messages ---
            if (Array.isArray(message) && message.length > 0) {
                // It's a multi-level hint
                let currentHintIndex = 0;
                const hints = message;

                const displayHint = () => {
                    messageEl.innerHTML = `<strong>[Gợi ý ${currentHintIndex + 1}/${hints.length}]</strong><br>${hints[currentHintIndex]}`;
                    if (currentHintIndex < hints.length - 1) {
                        nextHintBtn.style.display = 'inline-block';
                    } else {
                        nextHintBtn.style.display = 'none';
                    }
                };

                displayHint(); // Show the first hint

                nextHintBtn.onclick = () => {
                    currentHintIndex++;
                    displayHint();
                };

            } else if (typeof message === 'string') {
                // It's a regular, single message
                messageEl.innerHTML = message;
            }
            // --- End Main Logic ---

            if (typeof MathJax !== 'undefined') {
                MathJax.typesetPromise([messageEl]).catch(err => console.error('MathJax Error in notification:', err));
            }

            if (customClass === 'illustration-modal') {
                resetBtn.style.display = 'inline-block';
                resetBtn.onclick = () => {
                    const iframe = messageEl.querySelector('iframe');
                    if (iframe) iframe.src = iframe.src;
                };
            }

            overlay.style.display = 'flex';
        },
        closeNotification: function() {
            document.getElementById('notification-overlay').style.display = 'none';
        }
    };

    /* --- js/quiz.js --- */
    const Quiz = (function() {
        const quizConfig = GAME_CONFIG.QUIZ;
        const quizQuestionEl = document.getElementById('quiz-question');
        const quizOptionsEl = document.getElementById('quiz-options');
        const quizFeedbackEl = document.getElementById('quiz-feedback');
        const quizInfoEl = document.getElementById('quiz-info');
        const nextButtonQuiz = document.getElementById('next-button-quiz');
        const hintButton = document.getElementById('hint-button');
        const illustrationButton = document.getElementById('illustration-button-quiz');
        const explanationButton = document.getElementById('explanation-button-quiz');
        const levelButtonsContainer = document.getElementById('level-buttons-container');

        let currentLevel = 1;
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let correctAnswersInLevel = 0;
        let totalScore = 0;
        let scoreAtLevelStart = 0;
        
        function initializeLevelSelection() {
            levelButtonsContainer.innerHTML = ''; 
            for (let i = 1; i <= quizConfig.TOTAL_LEVELS; i++) {
                const button = document.createElement('button');
                button.className = 'game-btn';
                button.dataset.action = 'start-quiz-at-level';
                button.dataset.level = i;
                button.textContent = `Level ${i}`;
                levelButtonsContainer.appendChild(button);
            }
        }

        function start(level = 1) {
            currentLevel = level;
            totalScore = 0;
            scoreAtLevelStart = 0;
            startLevel();
        }

        function startLevel() {
            const levelKey = `level${currentLevel}`;
            if (!quizConfig.QUESTIONS[levelKey] || quizConfig.QUESTIONS[levelKey].length === 0) {
                showQuizCompletionScreen();
                return;
            }
            currentQuestions = Utils.shuffleAndPickN(quizConfig.QUESTIONS[levelKey], quizConfig.QUESTIONS_PER_LEVEL);
            currentQuestionIndex = 0;
            correctAnswersInLevel = 0;
            scoreAtLevelStart = totalScore;
            updateQuizHeader();
            showQuizQuestion();
            nextButtonQuiz.textContent = "Câu tiếp theo";
            nextButtonQuiz.onclick = handleNextQuestionClick;
        }

        function updateQuizHeader() {
            quizInfoEl.innerHTML = `Level ${currentLevel} - Câu hỏi ${currentQuestionIndex + 1}/${currentQuestions.length} (Điểm: ${totalScore})`;
            nextButtonQuiz.style.display = 'none';
            illustrationButton.style.display = 'none';
            explanationButton.style.display = 'none';
        }

        function showQuizQuestion() {
            quizFeedbackEl.innerHTML = '';
            const q = currentQuestions[currentQuestionIndex];
            if (!q) {
                checkLevelCompletion();
                return;
            }
            quizQuestionEl.innerHTML = q.question;
            quizOptionsEl.innerHTML = '';
            
            if (q.hint && q.hint.length > 0) {
                hintButton.style.display = 'flex';
                hintButton.onclick = () => {
                    Utils.showNotification('💡 Gợi ý', q.hint);
                };
            } else {
                hintButton.style.display = 'none';
            }
            
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('div');
                btn.className = 'quiz-option';
                btn.innerHTML = opt;
                btn.onclick = () => selectQuizOption(btn, idx, q.answer);
                quizOptionsEl.appendChild(btn);
            });

            if (typeof MathJax !== 'undefined') {
                MathJax.typesetPromise([quizQuestionEl, quizOptionsEl]).catch(err => console.error('MathJax Error:', err));
            }
        }

        function selectQuizOption(btn, selectedIndex, correctIndex) {
            const allOptions = document.querySelectorAll('.quiz-option');
            if (btn.classList.contains('correct') || btn.classList.contains('incorrect')) return;

            const q = currentQuestions[currentQuestionIndex];

            if (selectedIndex === correctIndex) {
                btn.classList.add('correct');
                correctAnswersInLevel++;
                totalScore += quizConfig.POINTS_PER_CORRECT_ANSWER;
            } else {
                btn.classList.add('incorrect');
                const correctOption = allOptions[correctIndex];
                if (correctOption) {
                    correctOption.classList.add('correct');
                }
            }

            allOptions.forEach(opt => opt.onclick = null);
            nextButtonQuiz.style.display = 'block';
            
            if (q.explanation && q.explanation.trim() !== "") {
                explanationButton.style.display = 'block';
                explanationButton.onclick = () => {
                    Utils.showNotification('📖 Giải thích', q.explanation);
                };
            }
            
            if (q.illustration) {
                illustrationButton.style.display = 'block';
                illustrationButton.onclick = () => {
                    const iframeContent = `<iframe src="${q.illustration}" style="width: 100%; height: 100%; border: none;"></iframe>`;
                    Utils.showNotification('🖼️ Hình minh họa', iframeContent, 'illustration-modal');
                };
            }
        }

        function handleNextQuestionClick() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuestions.length) {
                updateQuizHeader();
                showQuizQuestion();
            } else {
                checkLevelCompletion();
            }
        }

        function checkLevelCompletion() {
            const quizResult = `Bạn đã hoàn thành Level ${currentLevel} với ${correctAnswersInLevel}/${currentQuestions.length} câu đúng.`;
            quizQuestionEl.textContent = "Kết thúc Level!";
            quizOptionsEl.innerHTML = '';
            quizInfoEl.innerHTML = '';
            hintButton.style.display = 'none';
            illustrationButton.style.display = 'none';
            explanationButton.style.display = 'none';
            
            if (correctAnswersInLevel >= quizConfig.CORRECT_ANSWERS_TO_PASS_LEVEL) {
                quizFeedbackEl.innerHTML = `✅ ${quizResult}<br>Tuyệt vời! Bạn đã vượt qua cấp độ này. Tổng điểm hiện tại: ${totalScore}.`;
                nextButtonQuiz.textContent = "Chuyển Level tiếp theo";
                nextButtonQuiz.onclick = () => {
                    currentLevel++;
                    if (currentLevel > quizConfig.TOTAL_LEVELS) {
                        showQuizCompletionScreen();
                    } else {
                        startLevel();
                    }
                };
            } else {
                totalScore = scoreAtLevelStart;
                quizFeedbackEl.innerHTML = `❌ ${quizResult}<br>Bạn chưa vượt qua được level này, hãy ôn tập lại và làm lại level này nhé. Tổng điểm hiện tại: ${totalScore}.`;
                nextButtonQuiz.textContent = "Làm lại Level này";
                nextButtonQuiz.onclick = () => {
                    startLevel();
                };
            }
            nextButtonQuiz.style.display = 'block';
        }

        function showQuizCompletionScreen() {
            quizQuestionEl.textContent = "🎉 Chúc mừng!";
            quizOptionsEl.innerHTML = '';
            quizInfoEl.innerHTML = '';
            quizFeedbackEl.innerHTML = `Bạn đã hoàn thành tất cả ${quizConfig.TOTAL_LEVELS} level! Tổng điểm cuối cùng của bạn là: ${totalScore}.`;
            hintButton.style.display = 'none';
            illustrationButton.style.display = 'none';
            explanationButton.style.display = 'none';
            nextButtonQuiz.textContent = "Quay lại chọn Level";
            nextButtonQuiz.onclick = () => {
                Game.showScreen('quiz-level-selection-screen');
            };
            nextButtonQuiz.style.display = 'block';
        }

        return {
            start: start,
            init: initializeLevelSelection
        };
    })();

    /* --- js/game.js --- */
    const Game = (function() {
        let lastAnswerType = null;

        function showScreen(id) {
            Utils.showScreen(id);
        }

        function handleInitialQuestionResult(message, type) {
            lastAnswerType = type;
            showScreen('result-screen');
            document.getElementById('character').style.display = 'block';
            const speech = document.getElementById('speech');
            speech.innerText = message;
            speech.style.display = 'block';
            document.getElementById('next-button').style.display = 'block';
        }

        function continueFlow() {
            if (lastAnswerType === 'no') {
                showScreen('quiz-level-selection-screen');
            } else {
                showScreen('game-selection-screen');
            }
        }
        
        function startQuizAtLevel(level) {
            showScreen('quiz-screen');
            Quiz.start(level);
        }

        function initializeEventListeners() {
            document.body.addEventListener('click', (event) => {
                const target = event.target.closest('[data-action], [data-screen-target]');
                if (!target) return;

                const action = target.dataset.action;
                const screenTarget = target.dataset.screenTarget;

                if (screenTarget) {
                    showScreen(screenTarget);
                }

                switch (action) {
                    case 'show-result':
                        handleInitialQuestionResult(target.dataset.message, target.dataset.type);
                        break;
                    case 'continue-flow':
                        continueFlow();
                        break;
                    case 'show-development-notification':
                        Utils.showNotification(`🚧 ${target.dataset.gameName}`, `Trò chơi này đang phát triển. Vui lòng quay lại sau!`);
                        break;
                    case 'close-notification':
                        Utils.closeNotification();
                        break;
                    case 'start-quiz-at-level':
                        startQuizAtLevel(parseInt(target.dataset.level));
                        break;
                    case 'return-to-level-selection':
                        showScreen('quiz-level-selection-screen');
                        break;
                    case 'go-home':
                        showScreen('game-screen');
                        break;
                    case 'show-instructions':
                        Utils.showNotification(
                            '📜 Hướng Dẫn Chơi',
                            `<ul style="text-align: left; padding-left: 20px; font-size: 16px;">
                                <li>Mỗi level có <strong>${GAME_CONFIG.QUIZ.QUESTIONS_PER_LEVEL} câu hỏi</strong> trắc nghiệm được chọn ngẫu nhiên.</li>
                                <li>Bạn cần trả lời đúng ít nhất <strong>${GAME_CONFIG.QUIZ.CORRECT_ANSWERS_TO_PASS_LEVEL} câu</strong> để vượt qua level.</li>
                                <li>Mỗi câu trả lời đúng sẽ nhận được <strong>${GAME_CONFIG.QUIZ.POINTS_PER_CORRECT_ANSWER} điểm</strong>.</li>
                                <li>Nếu không đủ số câu đúng, bạn sẽ phải chơi lại level đó và điểm số sẽ quay về mốc trước khi bắt đầu level.</li>
                                <li>Nhấn nút <strong>?</strong> ở góc trên bên trái để nhận gợi ý. Gợi ý có thể có nhiều cấp độ, hãy nhấn "Gợi ý tiếp theo" để xem thêm.</li>
                                <li>Sau khi trả lời, nếu câu hỏi có hình minh họa hoặc giải thích, các nút tương ứng sẽ xuất hiện.</li>
                            </ul>`
                        );
                        break;
                }
            });
        }
        
        function mainInit() {
            Quiz.init();
            initializeEventListeners();

            // Handle deep linking via URL hash for navigation consistency
            const hash = window.location.hash;
            if (hash === '#game-selection-screen') {
                showScreen('game-selection-screen');
            } else if (hash === '#quiz-level-selection-screen') {
                // Ensure correct screen is shown when returning from Kien thuc.html
                showScreen('quiz-level-selection-screen');
            }
        }

        return {
            init: mainInit,
            showScreen: showScreen
        };
    })();

    document.addEventListener('DOMContentLoaded', Game.init);
</script>
