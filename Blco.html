<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trò Chơi Xếp Khối - Kiểu Block Blast</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script>
      MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']]
        },
        svg: {
          fontCache: 'global'
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        :root {
            font-size: clamp(12px, 3.5vw, 16px);
            --board-bg: #34495e;
            --empty-cell-bg: #4a6572;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        @keyframes blockPlaceAnim {
            0% { transform: scale(0.3); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            80% { transform: scale(0.95); }
            100% { transform: scale(1.0); opacity: 1; }
        }
        @keyframes clearAnimation {
            0% { transform: scale(1.0); opacity: 1; }
            50% { transform: scale(1.2); background-color: #fff; box-shadow: 0 0 15px #fff; }
            100% { transform: scale(0); opacity: 0; }
        }
        @keyframes scorePopupAnim {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-50px); }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulsePreview {
            0% { transform: scale(1.0); background-color: rgba(236, 240, 241, 0.3); }
            50% { transform: scale(1.08); background-color: rgba(236, 240, 241, 0.5); }
            100% { transform: scale(1.0); background-color: rgba(236, 240, 241, 0.3); }
        }
        @keyframes shake {
            10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(2px); }
            30%, 50%, 70% { transform: translateX(-3px); } 40%, 60% { transform: translateX(3px); }
        }

        body {
            font-family: 'Nunito', sans-serif;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            background: linear-gradient(to bottom right, #2c3e50, #3498db);
            padding: 2rem 1rem;
            color: #ecf0f1;
            min-height: 100vh;
        }

        .game-wrapper {
            width: 100%;
            max-width: 500px;
            margin: auto;
        }

        .game-container {
            position: relative;
            text-align: center;
            background-color: rgba(44, 62, 80, 0.8);
            padding: 1.2rem;
            border-radius: 1rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }
        
        #player-name-display {
            font-size: 1.1rem;
            color: #f1c40f;
            margin-bottom: 1rem;
            font-weight: bold;
        }
        
        #score-popup-container {
            position: absolute;
            top: 8rem;
            left: 50%;
            transform: translateX(-50%);
            width: 12rem;
            height: 12rem;
            pointer-events: none;
            z-index: 100;
        }
        
        .score-popup {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            font-weight: bold;
            color: #f1c40f;
            text-shadow: 2px 2px 2px rgba(0,0,0,0.7);
            animation: scorePopupAnim 1.2s ease-out forwards;
        }

        .info-panel {
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        #lives-container {
            font-size: 1.4rem;
            display: flex;
            gap: 0.2rem;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 0.25rem;
            background-color: var(--board-bg);
            border: 0.3rem solid var(--board-bg);
            border-radius: 0.5rem;
            margin: 0 auto 0.75rem auto;
            padding: 0.3rem;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            width: 100%;
            aspect-ratio: 1 / 1;
        }

        .cell {
            background-color: var(--empty-cell-bg);
            border-radius: 0.25rem;
            transition: background-color 0.15s ease-in-out;
        }

        .cell.filled {
            border-bottom: 0.25rem solid rgba(0,0,0,0.2);
            box-shadow: inset 0 0.2rem 0.3rem rgba(255,255,255,0.2);
            animation: blockPlaceAnim 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        .cell-color-cyan { background: linear-gradient(145deg, #1abc9c, #16a085); }
        .cell-color-blue { background: linear-gradient(145deg, #3498db, #2980b9); }
        .cell-color-yellow { background: linear-gradient(145deg, #f1c40f, #f39c12); }
        .cell-color-red { background: linear-gradient(145deg, #e74c3c, #c0392b); }
        .cell-color-purple { background: linear-gradient(145deg, #9b59b6, #8e44ad); }
        .cell-color-orange { background: linear-gradient(145deg, #e67e22, #d35400); }
        .cell-color-green { background: linear-gradient(145deg, #2ecc71, #27ae60); }
        .cell-color-pink { background: linear-gradient(145deg, #e84393, #c30062); }
        .cell-color-teal { background: linear-gradient(145deg, #00cec9, #00b894); }
        .cell-color-brown { background: linear-gradient(145deg, #a0522d, #8b4513); }

        .cell.preview { animation: pulsePreview 1.2s infinite ease-in-out; }
        .cell.invalid-preview { background-color: rgba(231, 76, 60, 0.6); animation: shake 0.4s ease-in-out; }
        .cell.clearing { animation: clearAnimation 0.6s ease-out forwards; }
        
        #instruction-text {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            min-height: 1.5rem;
        }

        .choices-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 0.5rem;
            min-height: 6rem;
        }

        .block-choice {
            cursor: grab;
            padding: 0.5rem;
            border-radius: 0.5rem;
            transition: transform 0.2s ease-out, opacity 0.2s ease-out;
        }
        .block-choice:hover { transform: translateY(-5px); }
        .block-choice.dragging { opacity: 0; transform: translateY(-5px); pointer-events: none; }

        .block-grid { display: grid; gap: 0.2rem; pointer-events: none; }
        
        .block-cell {
            width: 1.2rem;
            height: 1.2rem;
        }
        .block-cell.filled { border-radius: 0.2rem; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex; justify-content: center; align-items: center;
            animation: fadeIn 0.3s ease; z-index: 1000;
            backdrop-filter: blur(5px);
            padding: 1rem;
        }
        .modal-overlay.hidden { display: none; }

        .modal-content {
            background-color: #34495e; color: #ecf0f1; padding: 1.5rem;
            border-radius: 1rem; text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(0,0,0,0.2); 
            width: 100%;
            max-width: 500px;
        }
        
        #question-text { font-size: 1.2rem; margin-top: 0; }
        #answer-options { display: flex; flex-direction: column; gap: 0.8rem; margin-top: 1.2rem; }

        .answer-btn, #restart-button, #next-question-button, #home-button, #start-game-button, #view-highscore-button, #close-highscore-button {
            padding: 0.8rem 1.5rem;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 0.5rem;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            border: none;
            transition: all 0.2s;
        }
        .answer-btn { border: 1px solid #7f8c8d; background-color: #566573; color: #ecf0f1; padding: 0.8rem 1rem; font-size: 1rem;}
        .answer-btn:hover { background-color: #7f8c8d; border-color: #95a5a6; transform: translateY(-2px); }
        
        #restart-button, #start-game-button { background-color: #3498db; color: white; }
        #restart-button:hover, #start-game-button:hover { background-color: #2980b9; }

        #home-button, #close-highscore-button { background-color: #7f8c8d; color: white; }
        #home-button:hover, #close-highscore-button:hover { background-color: #95a5a6; }
        
        #view-highscore-button { background-color: #27ae60; color: white; }
        #view-highscore-button:hover { background-color: #229954; }
        
        .game-over-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        
        #player-name-input {
            width: 80%;
            padding: 0.8rem;
            font-size: 1.1rem;
            margin: 1rem 0;
            border-radius: 0.5rem;
            border: 2px solid #7f8c8d;
            background-color: #ecf0f1;
            color: #2c3e50;
        }

        #next-question-button { 
            margin: 0.5rem 0 1rem 0;
            background-color: #27ae60; 
            color: white; 
        }
        #next-question-button:hover { background-color: #229954; }

        .hidden { display: none; }

        #highscore-list {
            list-style: none;
            padding: 0;
            margin-top: 1rem;
            margin-bottom: 1.5rem;
        }
        #highscore-list li {
            display: flex;
            justify-content: space-between;
            padding: 0.3rem 0;
            font-size: 1.1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        #highscore-list li:last-child {
            border-bottom: none;
        }
        #highscore-list .rank { font-weight: bold; color: #1abc9c; }
        #highscore-list .name { flex-grow: 1; text-align: left; margin-left: 1rem; }
        #highscore-list .score { font-weight: bold; color: #e67e22; }

    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="game-container">
            <h1>Xếp Khối Trí Tuệ</h1>
            <div id="player-name-display"></div>
            <div id="score-popup-container"></div>
            <div class="info-panel">
                <div>Lượt: <span id="turn-counter">0</span></div>
                <div id="lives-container"></div>
                <div>Điểm: <span id="score-counter">0</span></div>
            </div>
            <div id="game-board" class="board"></div>
            <h2 id="instruction-text">Sẵn sàng để thử thách trí tuệ chưa?</h2>
            <button id="next-question-button" class="hidden">Câu Tiếp Theo</button>
            <div id="block-choices" class="choices-container"></div>
        </div>
    </div>
    
    <div id="start-screen" class="modal-overlay">
        <div class="modal-content">
            <h2>Chào Mừng!</h2>
            <p>Vui lòng nhập tên của bạn để bắt đầu.</p>
            <input type="text" id="player-name-input" placeholder="Tên người chơi..." maxlength="15">
            <button id="start-game-button">Bắt đầu</button>
        </div>
    </div>
    
    <div id="game-over-screen" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 id="game-over-title">Kết Thúc!</h2>
            <p style="font-size: 1.1rem; margin-top: 0.5rem;">Chúc mừng bạn đã hoàn thành lượt chơi!</p>
            <p style="font-size: 2.5rem; font-weight: bold; margin: 1rem 0; color: #f1c40f;"><span id="final-score">0</span></p>
            <div class="game-over-buttons">
                <button id="restart-button">Chơi Lại</button>
                <button id="view-highscore-button">Xem Bảng Xếp Hạng</button>
                <button id="home-button">Về Trang Chủ</button>
            </div>
        </div>
    </div>

    <div id="question-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 id="question-text">Đây là câu hỏi?</h2>
            <div id="answer-options"></div>
        </div>
    </div>
    
    <div id="highscore-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 style="color: #f1c40f;">🏆 Bảng Xếp Hạng 🏆</h2>
            <ul id="highscore-list"></ul>
            <button id="close-highscore-button">Đóng</button>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const BOARD_SIZE = 8;
            const ANIMATION_DELAY = 600;
            const MAX_LIVES = 5;

            const BLOCK_LIBRARY = {
                dot:   { points: 1, shape: [[1]], colorClass: 'cell-color-cyan' },
                domino2: { points: 2, shape: [[1,1]], colorClass: 'cell-color-cyan' },
                bar3:  { points: 3, shape: [[1,1,1]], colorClass: 'cell-color-blue' },
                bar4:  { points: 4, shape: [[1,1,1,1]], colorClass: 'cell-color-blue' },
                bar5:  { points: 5, shape: [[1,1,1,1,1]], colorClass: 'cell-color-blue' },
                sqr2:  { points: 4, shape: [[1,1],[1,1]], colorClass: 'cell-color-yellow' },
                l3:    { points: 3, shape: [[1,0],[1,1]], colorClass: 'cell-color-orange' },
                l4:    { points: 4, shape: [[1,0,0],[1,1,1]], colorClass: 'cell-color-orange' },
                l5:    { points: 5, shape: [[1,0],[1,0],[1,1,1]], colorClass: 'cell-color-orange' },

                pipe3: { points: 3, shape: [[1],[1],[1]], colorClass: 'cell-color-blue' },
                pipe4: { points: 4, shape: [[1],[1],[1],[1]], colorClass: 'cell-color-blue' },
                pipe5: { points: 5, shape: [[1],[1],[1],[1],[1]], colorClass: 'cell-color-blue' },
                smallL: { points: 3, shape: [[1,0],[1,0],[1,1]], colorClass: 'cell-color-orange' },

            const QA_DATABASE = [
                {
                    question: "Trong không gian, cho tứ giác ABCD có các cặp cạnh đối không song song và điểm S không thuộc mặt phẳng (ABCD). Giao tuyến của hai mặt phẳng (SAC) và (SBD) là đường thẳng nào?",
                    options: ["SO, với O là giao điểm của AB và CD.", "SO, với O là giao điểm của AC và BD.", "SI, với I là giao điểm của AD và BC.", "SJ, với J là giao điểm của AB và CD."],

                },
                {

                {

                {

                    correctAnswer: "$\\frac{a\\sqrt{3}}{3}$",
                    blocks: [BLOCK_LIBRARY.dot, BLOCK_LIBRARY.l3, BLOCK_LIBRARY.domino2],
                    hardestBlockIndex: 1

            ];

            const elements = {
                board: document.getElementById('game-board'),
                choices: document.getElementById('block-choices'),
                score: document.getElementById('score-counter'),
                turn: document.getElementById('turn-counter'),
                livesContainer: document.getElementById('lives-container'),
                gameOverScreen: document.getElementById('game-over-screen'),
                gameOverTitle: document.getElementById('game-over-title'),
                finalScore: document.getElementById('final-score'),
                restartButton: document.getElementById('restart-button'),
                homeButton: document.getElementById('home-button'),
                questionModal: document.getElementById('question-modal'),
                questionText: document.getElementById('question-text'),
                answerOptions: document.getElementById('answer-options'),
                instructionText: document.getElementById('instruction-text'),
                nextQuestionButton: document.getElementById('next-question-button'),
                scorePopupContainer: document.getElementById('score-popup-container'),
                startScreen: document.getElementById('start-screen'),
                startGameButton: document.getElementById('start-game-button'),
                playerNameInput: document.getElementById('player-name-input'),
                playerNameDisplay: document.getElementById('player-name-display'),
                highscoreModal: document.getElementById('highscore-modal'),
                highscoreList: document.getElementById('highscore-list'),
                viewHighscoreButton: document.getElementById('view-highscore-button'),
                closeHighscoreButton: document.getElementById('close-highscore-button'),
            };

            let boardState, score, turn, lives, currentBlocks, currentQuestion, draggedBlock, isAnimating, currentPlayerName;
            
            function initGame() {
                boardState = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(null));
                score = 0; turn = 0; lives = MAX_LIVES;
                currentBlocks = []; currentQuestion = null;
                draggedBlock = null; isAnimating = false;
                elements.gameOverScreen.classList.add('hidden');
                elements.questionModal.classList.add('hidden');
                elements.highscoreModal.classList.add('hidden');
                elements.nextQuestionButton.classList.add('hidden');
                elements.board.style.pointerEvents = 'auto';
                
                elements.instructionText.textContent = "Chào mừng! Hãy bắt đầu trò chơi.";
                elements.choices.innerHTML = ''; 

                updateInfoPanel();
                renderBoard();
                showStartScreen();
            }

            function showStartScreen() {
                elements.startScreen.classList.remove('hidden');
                elements.playerNameDisplay.textContent = '';
                elements.playerNameInput.value = '';
            }

            function startGame() {
                const name = elements.playerNameInput.value.trim();
                if (name === '') {
                    alert('Vui lòng nhập tên của bạn!');
                    return;
                }
                currentPlayerName = name;
                elements.playerNameDisplay.textContent = `Người chơi: ${currentPlayerName}`;
                elements.startScreen.classList.add('hidden');
                startTurn();
            }

            function startTurn() {
                turn = 1;
                updateInfoPanel();

                isAnimating = true;
                elements.board.style.pointerEvents = 'none';
                elements.choices.innerHTML = '';
                elements.nextQuestionButton.classList.add('hidden');
                elements.instructionText.textContent = "Hãy trả lời câu hỏi để nhận khối...";
                currentQuestion = QA_DATABASE[Math.floor(Math.random() * QA_DATABASE.length)];
                showQuestionModal(currentQuestion);
            }
            
            function nextTurn() {
                 isAnimating = true;
                elements.board.style.pointerEvents = 'none';
                elements.choices.innerHTML = '';
                elements.nextQuestionButton.classList.add('hidden');
                elements.instructionText.textContent = "Hãy trả lời câu hỏi để nhận khối...";
                currentQuestion = QA_DATABASE[Math.floor(Math.random() * QA_DATABASE.length)];
                showQuestionModal(currentQuestion);
            }

            function isGameOver() {
                if (currentBlocks.length === 0) return true;
                for (const block of currentBlocks) {
                    for (let r = 0; r < BOARD_SIZE; r++) {
                        for (let c = 0; c < BOARD_SIZE; c++) {
                            if (canPlaceBlock(block.shape, r, c)) return false;
                        }
                    }
                }
                return true;
            }

            function endGame(reason = "no_moves") {
                if (reason === 'no_lives') {
                    elements.gameOverTitle.textContent = "Bạn Đã Hết Tim!";
                } else {
                    elements.gameOverTitle.textContent = "Hết Nước Đi!";
                }
                elements.finalScore.textContent = score;
                updateHighScores(currentPlayerName, score);
                displayHighScores(); // Chuẩn bị dữ liệu cho modal
                elements.gameOverScreen.classList.remove('hidden');
            }
            
            function getHighScores() {
                const scoresJSON = localStorage.getItem('blockBlastHighScores');
                return scoresJSON ? JSON.parse(scoresJSON) : [];
            }

            function updateHighScores(name, newScore) {
                const highScores = getHighScores();
                highScores.push({ name, score: newScore });
                highScores.sort((a, b) => b.score - a.score);
                const topScores = highScores.slice(0, 5);
                localStorage.setItem('blockBlastHighScores', JSON.stringify(topScores));
            }

            function displayHighScores() {
                const highScores = getHighScores();
                elements.highscoreList.innerHTML = '';
                if (highScores.length === 0) {
                    elements.highscoreList.innerHTML = '<li>Chưa có ai chơi. Hãy là người đầu tiên!</li>';
                    return;
                }
                highScores.forEach((scoreItem, index) => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <span class="rank">#${index + 1}</span>
                        <span class="name">${scoreItem.name}</span>
                        <span class="score">${scoreItem.score}</span>
                    `;
                    elements.highscoreList.appendChild(li);
                });
            }

            function showQuestionModal(questionData) {
                elements.questionText.innerHTML = questionData.question;
                elements.answerOptions.innerHTML = ''; 

                questionData.options.forEach(option => {
                    const button = document.createElement('button');
                    button.className = 'answer-btn';
                    button.innerHTML = option;
                    button.onclick = () => handleAnswer(option);
                    elements.answerOptions.appendChild(button);
                });
                
                if (window.MathJax) {
                    window.MathJax.typesetPromise([elements.questionModal]).catch(err => console.error('MathJax typeset error:', err));
                }

                elements.questionModal.classList.remove('hidden');
            }

            function handleAnswer(selectedAnswer) {
                elements.questionModal.classList.add('hidden');
                
                if (selectedAnswer === currentQuestion.correctAnswer) {
                    elements.instructionText.textContent = "Đúng rồi! Hãy kéo một khối vào bảng.";
                    currentBlocks = JSON.parse(JSON.stringify(currentQuestion.blocks));
                } else {
                    lives--;
                    updateInfoPanel();

                    if (lives <= 0) {
                        elements.instructionText.textContent = "Sai rồi! Bạn đã hết tim.";
                        setTimeout(() => endGame('no_lives'), 1500);
                        return;
                    }

                    elements.instructionText.textContent = "Sai rồi! Bạn phải dùng khối khó nhất.";
                    const hardestBlock = currentQuestion.blocks[currentQuestion.hardestBlockIndex];
                    currentBlocks = [JSON.parse(JSON.stringify(hardestBlock))];
                }
                
                renderBlockChoices();
                isAnimating = false;
                elements.board.style.pointerEvents = 'auto';
                
                if (isGameOver()) {
                    elements.instructionText.textContent = "Không còn nước đi nào!";
                    setTimeout(() => endGame('no_moves'), 1500);
                }
            }
            
            function canPlaceBlock(shape, startRow, startCol) {
                for (let r = 0; r < shape.length; r++) {
                    for (let c = 0; c < shape[r].length; c++) {
                        if (shape[r][c] === 1) {
                            const boardR = startRow + r;
                            const boardC = startCol + c;
                            if (boardR >= BOARD_SIZE || boardC >= BOARD_SIZE || boardState[boardR][boardC] !== null) {
                                return false;
                            }
                        }
                    }
                }
                return true;
            }
            
            function createScorePopup(points) {
                if (points <= 0) return;
                const popup = document.createElement('div');
                popup.textContent = `+${points}`;
                popup.className = 'score-popup';
                elements.scorePopupContainer.appendChild(popup);
                popup.addEventListener('animationend', () => popup.remove());
            }

            async function placeBlock(block, startRow, startCol) {
                if (!canPlaceBlock(block.shape, startRow, startCol)) return;

                isAnimating = true;
                elements.board.style.pointerEvents = 'none';
                
                const cellsToAnimate = [];
                let placedCellsCount = 0;
                for (let r = 0; r < block.shape.length; r++) {
                    for (let c = 0; c < block.shape[r].length; c++) {
                        if (block.shape[r][c] === 1) {
                            placedCellsCount++;
                            const boardR = startRow + r;
                            const boardC = startCol + c;
                            boardState[boardR][boardC] = block.colorClass;
                            cellsToAnimate.push({ r: boardR, c: boardC });
                        }
                    }
                }

                score += placedCellsCount;
                createScorePopup(placedCellsCount);
                updateInfoPanel();

                cellsToAnimate.forEach((cell, index) => {
                    const cellEl = elements.board.querySelector(`[data-row='${cell.r}'][data-col='${cell.c}']`);
                    if (cellEl) {
                        cellEl.className = 'cell';
                        setTimeout(() => {
                            cellEl.classList.add('filled', block.colorClass);
                            cellEl.style.animationDelay = `${index * 0.05}s`;
                        }, 10);
                    }
                });

                await new Promise(resolve => setTimeout(resolve, cellsToAnimate.length * 50 + 400));
                
                await handleLineClears();
                
                currentBlocks = [];
                renderBlockChoices();
                
                turn++;
                updateInfoPanel();
                elements.instructionText.textContent = "Tốt lắm! Nhấn nút để sang câu tiếp theo.";
                elements.nextQuestionButton.classList.remove('hidden');
                isAnimating = false;
                elements.board.style.pointerEvents = 'auto';
            }

            async function handleLineClears() {
                const rowsToClear = [], colsToClear = [];
                for (let r = 0; r < BOARD_SIZE; r++) if (boardState[r].every(c => c !== null)) rowsToClear.push(r);
                for (let c = 0; c < BOARD_SIZE; c++) if (boardState.every(r => r[c] !== null)) colsToClear.push(c);

                const linesCount = rowsToClear.length + colsToClear.length;
                if (linesCount === 0) return;
                
                const scorePerLine = 100;
                const comboBonus = linesCount > 1 ? (linesCount - 1) * 50 : 0;
                const totalClearScore = linesCount * scorePerLine + comboBonus;
                
                score += totalClearScore;
                createScorePopup(totalClearScore);

                const cellsToClear = new Set();
                rowsToClear.forEach(r => {
                    for (let c = 0; c < BOARD_SIZE; c++) cellsToClear.add(`${r}-${c}`);
                });
                colsToClear.forEach(c => {
                    for (let r = 0; r < BOARD_SIZE; r++) cellsToClear.add(`${r}-${c}`);
                });

                const cellsToFlash = Array.from(cellsToClear).map(id => {
                    const [r, c] = id.split('-').map(Number);
                    return {r, c};
                });

                cellsToFlash.forEach(({r, c}) => elements.board.querySelector(`[data-row='${r}'][data-col='${c}']`)?.classList.add('clearing'));
                await new Promise(resolve => setTimeout(resolve, ANIMATION_DELAY));

                rowsToClear.forEach(r => { for (let c = 0; c < BOARD_SIZE; c++) boardState[r][c] = null; });
                colsToClear.forEach(c => { for (let r = 0; r < BOARD_SIZE; r++) boardState[r][c] = null; });
                
                updateInfoPanel();
                renderBoard();
            }

            function renderBoard() {
                elements.board.innerHTML = '';
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        const colorClass = boardState[r][c];
                        if (colorClass) {
                            cell.classList.add('filled', colorClass);
                            cell.style.animation = 'none';
                        }
                        cell.dataset.row = r; cell.dataset.col = c;
                        elements.board.appendChild(cell);
                    }
                }
                addBoardDragDropListeners();
            }

            function renderBlockChoices() {
                elements.choices.innerHTML = '';
                currentBlocks.forEach((block, index) => {
                    const choiceEl = document.createElement('div');
                    choiceEl.className = 'block-choice';
                    choiceEl.dataset.blockIndex = index;
                    choiceEl.draggable = true;
                    
                    const grid = document.createElement('div');
                    grid.className = 'block-grid';
                    grid.style.gridTemplateColumns = `repeat(${block.shape[0].length}, 1fr)`;
                    
                    block.shape.forEach(row => row.forEach(val => {
                        const cell = document.createElement('div');
                        cell.className = 'block-cell';
                        if (val === 1) cell.classList.add('filled', block.colorClass);
                        grid.appendChild(cell);
                    }));
                    choiceEl.appendChild(grid);
                    elements.choices.appendChild(choiceEl);
                });
                addChoiceDragListeners();
            }

            function updateInfoPanel() {
                elements.score.textContent = score;
                elements.turn.textContent = turn;
                elements.livesContainer.innerHTML = '';
                for (let i = 0; i < MAX_LIVES; i++) {
                    const heart = document.createElement('span');
                    heart.textContent = i < lives ? '❤️' : '🖤';
                    elements.livesContainer.appendChild(heart);
                }
            }
            
            function showPreview(shape, startRow, startCol) {
                clearPreview();
                const isValid = canPlaceBlock(shape, startRow, startCol);
                
                for (let r = 0; r < shape.length; r++) {
                    for (let c = 0; c < shape[r].length; c++) {
                        if (shape[r][c] === 1) {
                            const boardR = startRow + r;
                            const boardC = startCol + c;
                            const cellEl = elements.board.querySelector(`[data-row='${boardR}'][data-col='${boardC}']`);
                            if (cellEl) {
                                cellEl.classList.add(isValid ? 'preview' : 'invalid-preview');
                            }
                        }
                    }
                }
            }
            
            function clearPreview() {
                document.querySelectorAll('.cell.preview, .cell.invalid-preview').forEach(c => {
                    c.classList.remove('preview', 'invalid-preview');
                });
            }

            function addChoiceDragListeners() {
                document.querySelectorAll('.block-choice').forEach(choice => {
                    choice.addEventListener('dragstart', e => {
                        if (isAnimating) { e.preventDefault(); return; }
                        
                        const draggedElement = e.currentTarget; 
                        const blockIndex = parseInt(draggedElement.dataset.blockIndex);
                        draggedBlock = { ...currentBlocks[blockIndex], index: blockIndex };
                        e.dataTransfer.setData('text/plain', blockIndex);

                        const blockGrid = draggedElement.querySelector('.block-grid');
                        if (blockGrid) {
                            const clone = blockGrid.cloneNode(true);
                            
                            const boardCellEl = elements.board.querySelector('.cell');
                            if (boardCellEl) {
                                const boardCellSize = boardCellEl.offsetWidth;
                                const boardGap = getComputedStyle(elements.board).gap;
                                clone.style.gap = boardGap;
                                clone.querySelectorAll('.block-cell').forEach(cell => {
                                    cell.style.width = `${boardCellSize}px`;
                                    cell.style.height = `${boardCellSize}px`;
                                });
                            }

                            clone.style.position = 'absolute';
                            clone.style.top = '-1000px';
                            document.body.appendChild(clone);
                            
                            e.dataTransfer.setDragImage(clone, 0, 0);

                            setTimeout(() => { if (clone.parentNode) { clone.parentNode.removeChild(clone); } }, 0);
                        }
                        
                        setTimeout(() => draggedElement.classList.add('dragging'), 0); 
                    });
                    choice.addEventListener('dragend', e => {
                        e.currentTarget.classList.remove('dragging');
                        draggedBlock = null;
                        clearPreview();
                    });
                });
            }

            function addBoardDragDropListeners() {
                elements.board.querySelectorAll('.cell').forEach(cell => {
                    cell.addEventListener('dragover', e => {
                        e.preventDefault();
                        if (!draggedBlock) return;
                        showPreview(draggedBlock.shape, parseInt(e.currentTarget.dataset.row), parseInt(e.currentTarget.dataset.col));
                    });
                    cell.addEventListener('dragleave', clearPreview);
                    cell.addEventListener('drop', e => {
                        e.preventDefault();
                        if (!draggedBlock || isAnimating) return;
                        clearPreview();
                        placeBlock(draggedBlock, parseInt(e.currentTarget.dataset.row), parseInt(e.currentTarget.dataset.col));
                        draggedBlock = null;
                    });
                });
            }
            
            // --- Event Listeners ---
            elements.startGameButton.addEventListener('click', startGame);
            elements.restartButton.addEventListener('click', initGame);
            elements.nextQuestionButton.addEventListener('click', nextTurn);
            
            elements.viewHighscoreButton.addEventListener('click', () => {
                elements.highscoreModal.classList.remove('hidden');
            });
            
            elements.closeHighscoreButton.addEventListener('click', () => {
                elements.highscoreModal.classList.add('hidden');
            });

            elements.homeButton.addEventListener('click', () => {
                window.location.href = 'index.html#game-selection-screen';
            });
            
            elements.playerNameInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    startGame();
                }
            });

            // --- Initialise Game ---
            initGame();
        });
    </script>
</body>
</html>
