<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô hình 3D: Thiết diện Ngũ giác</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #f0f0f0; }
        canvas { display: block; width: 100%; height: 100vh; }
        .label {
            position: absolute;
            font-size: 16px;
            color: #000000;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.75);
            padding: 2px 6px;
            border-radius: 5px;
            pointer-events: none;
            transform: translate(-50%, -50%);
            white-space: nowrap;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <script>
        let scene, camera, renderer, controls;
        let labels = {};

        // --- 1. Define Coordinates ---
        const A = new THREE.Vector3(0, 0, 0);
        const B = new THREE.Vector3(12, 0, 0);
        const D = new THREE.Vector3(4, 0, 10);
        const C = new THREE.Vector3().addVectors(B, D); // C = B+D-A
        const S = new THREE.Vector3(6, 15, 5);

        // Midpoints M, N, P
        const M = new THREE.Vector3().addVectors(B, C).multiplyScalar(0.5);
        const N = new THREE.Vector3().addVectors(C, D).multiplyScalar(0.5);
        const P = new THREE.Vector3().addVectors(S, A).multiplyScalar(0.5);

        // --- Calculate cross-section vertices R and Q ---
        // R on SB
        const t_R = 3/4; 
        const R = new THREE.Vector3().lerpVectors(S, B, t_R);

        // Q on SD
        const t_Q = 3/4; 
        const Q = new THREE.Vector3().lerpVectors(S, D, t_Q);


        // --- 2. Materials ---
        const pointMaterial = new THREE.MeshBasicMaterial({ color: 0x333333 });
        const occlusionMaterial = new THREE.MeshPhongMaterial({ color: 0xFFFFFF, side: THREE.DoubleSide, colorWrite: false, depthWrite: true });
        const sectionMaterial = new THREE.MeshPhongMaterial({ color: 0x1E90FF, side: THREE.DoubleSide, opacity: 0.4, transparent: true }); // Blue section
        const hiddenDashedLineMaterial = new THREE.LineDashedMaterial({ color: 0x444444, linewidth: 5, dashSize: 1, gapSize: 1, depthWrite: false, depthFunc: THREE.GreaterEqualDepth });
        
        const visibleSolidLineMaterial = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 7, depthFunc: THREE.LessEqualDepth });
        const visibleBoldLineMaterial = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 15, depthFunc: THREE.LessEqualDepth }); // Bold black for section edges

        // --- Helper Functions ---
        function addLabel(position, text) {
            const element = document.createElement('div');
            element.className = 'label';
            element.textContent = text;
            document.body.appendChild(element);
            labels[text] = { element: element, position: position };
        }

        function createPointSphere(position, labelText) {
            const geometry = new THREE.SphereGeometry(0.3, 16, 16);
            const sphere = new THREE.Mesh(geometry, pointMaterial);
            sphere.position.copy(position);
            scene.add(sphere);
            addLabel(position, labelText);
        }

        function addEdge(v1, v2, material) {
            const points = [v1, v2];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const dashedLine = new THREE.Line(geometry, hiddenDashedLineMaterial);
            dashedLine.computeLineDistances();
            dashedLine.renderOrder = 2;
            scene.add(dashedLine);
            const solidLine = new THREE.Line(geometry, material);
            solidLine.renderOrder = 3;
            scene.add(solidLine);
        }
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(20, 15, 25);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(8, 5, 5);
            scene.add(new THREE.AmbientLight(0xcccccc));
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7.5);
            scene.add(directionalLight);

            // --- Occlusion Geometry ---
            const facesGeometry = new THREE.BufferGeometry();
            const vertices = new Float32Array([
                // Base (2 triangles)
                A.x, A.y, A.z,   B.x, B.y, B.z,   D.x, D.y, D.z,
                B.x, B.y, B.z,   C.x, C.y, C.z,   D.x, D.y, D.z,
                // Lateral faces
                S.x, S.y, S.z,   A.x, A.y, A.z,   B.x, B.y, B.z,
                S.x, S.y, S.z,   B.x, B.y, B.z,   C.x, C.y, C.z,
                S.x, S.y, S.z,   C.x, C.y, C.z,   D.x, D.y, D.z,
                S.x, S.y, S.z,   D.x, D.y, D.z,   A.x, A.y, A.z
            ]);
            facesGeometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            facesGeometry.computeVertexNormals();
            const occlusionMesh = new THREE.Mesh(facesGeometry, occlusionMaterial);
            occlusionMesh.renderOrder = 0;
            scene.add(occlusionMesh);

            // --- Cross-section Pentagon Mesh ---
            const sectionGeom = new THREE.BufferGeometry();
            const verticesSection = new Float32Array([
                P.x, P.y, P.z,
                R.x, R.y, R.z,
                M.x, M.y, M.z,
                N.x, N.y, N.z,
                Q.x, Q.y, Q.z
            ]);
            // Triangulate the pentagon
            const indices = [ 0, 1, 2,  0, 2, 3,  0, 3, 4 ];
            sectionGeom.setAttribute('position', new THREE.BufferAttribute(verticesSection, 3));
            sectionGeom.setIndex(indices);
            sectionGeom.computeVertexNormals();
            const sectionMesh = new THREE.Mesh(sectionGeom, sectionMaterial);
            sectionMesh.renderOrder = 1;
            scene.add(sectionMesh);
            
            // --- Visible Geometry ---
            createPointSphere(S, 'S');
            createPointSphere(A, 'A');
            createPointSphere(B, 'B');
            createPointSphere(C, 'C');
            createPointSphere(D, 'D');

            // Section vertices
            createPointSphere(P, 'P');
            createPointSphere(R, 'R');
            createPointSphere(M, 'M');
            createPointSphere(N, 'N');
            createPointSphere(Q, 'Q');

            // Section edges (bold)
            addEdge(P, R, visibleBoldLineMaterial);
            addEdge(R, M, visibleBoldLineMaterial);
            addEdge(M, N, visibleBoldLineMaterial);
            addEdge(N, Q, visibleBoldLineMaterial);
            addEdge(Q, P, visibleBoldLineMaterial);

            // Pyramid edges
            addEdge(S, A, visibleSolidLineMaterial);
            addEdge(S, B, visibleSolidLineMaterial);
            addEdge(S, C, visibleSolidLineMaterial);
            addEdge(S, D, visibleSolidLineMaterial);
            addEdge(A, B, visibleSolidLineMaterial);
            addEdge(B, C, visibleSolidLineMaterial);
            addEdge(C, D, visibleSolidLineMaterial);
            addEdge(D, A, visibleSolidLineMaterial);
        }

        function updateLabels() {
            for (const key in labels) {
                const label = labels[key];
                const vector = label.position.clone().project(camera);
                const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-vector.y * 0.5 + 0.5) * window.innerHeight;
                label.element.style.left = `${x}px`;
                label.element.style.top = `${y}px`;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateLabels();
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
        animate();
        window.addEventListener('resize', onWindowResize);
    </script>
</body>
</html>
