<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô hình 3D: Thiết diện lăng trụ</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #f0f0f0; }
        canvas { display: block; width: 100%; height: 100vh; }
        .label {
            position: absolute;
            font-size: 16px;
            color: #000000;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.75);
            padding: 2px 6px;
            border-radius: 5px;
            pointer-events: none;
            transform: translate(-50%, -50%);
            white-space: nowrap;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <script>
        let scene, camera, renderer, controls;
        let labels = {};

        // --- 1. Define Coordinates (a = 10) ---
        const a = 10;
        const h = a; 
        
        const A = new THREE.Vector3(0, 0, 0);
        const B = new THREE.Vector3(a, 0, 0);
        const C = new THREE.Vector3(a/2, a * Math.sqrt(3) / 2, 0);

        const A_ = new THREE.Vector3(0, 0, h);
        const B_ = new THREE.Vector3(a, 0, h);
        const C_ = new THREE.Vector3(a/2, a * Math.sqrt(3) / 2, h);
        
        // Key points
        const O = new THREE.Vector3(a/2, a * Math.sqrt(3) / 6, 0);
        const I = new THREE.Vector3(a/2, 0, a/2); // Center of ABB'A'
        const J = new THREE.Vector3(a/4, a * Math.sqrt(3) / 4, a/2); // Center of ACC'A'
        
        const M = new THREE.Vector3(2*a/3, 0, 0); // M on AB
        const N = new THREE.Vector3(a/3, a * Math.sqrt(3) / 3, 0); // N on AC
        
        // --- 2. Materials ---
        const pointMaterial = new THREE.MeshBasicMaterial({ color: 0x333333 });
        const occlusionMaterial = new THREE.MeshPhongMaterial({ color: 0xFFFFFF, side: THREE.DoubleSide, colorWrite: false, depthWrite: true });
        const sectionMaterial = new THREE.MeshPhongMaterial({ color: 0x1E90FF, side: THREE.DoubleSide, opacity: 0.5, transparent: true });
        const hiddenDashedLineMaterial = new THREE.LineDashedMaterial({ color: 0x444444, linewidth: 5, dashSize: 1, gapSize: 1, depthWrite: false, depthFunc: THREE.GreaterEqualDepth });
        const visibleSolidLineMaterial = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 7, depthFunc: THREE.LessEqualDepth });
        const visibleBoldLineMaterial = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 15, depthFunc: THREE.LessEqualDepth });

        // --- Helper Functions ---
        function addLabel(position, text) {
            const element = document.createElement('div');
            element.className = 'label';
            element.textContent = text;
            document.body.appendChild(element);
            labels[text] = { element: element, position: position };
        }

        function createPointSphere(position, labelText) {
            const geometry = new THREE.SphereGeometry(0.2, 16, 16);
            const sphere = new THREE.Mesh(geometry, pointMaterial);
            sphere.position.copy(position);
            scene.add(sphere);
            addLabel(position, labelText);
        }

        function addEdge(v1, v2, material) {
            const points = [v1, v2];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const dashedLine = new THREE.Line(geometry, hiddenDashedLineMaterial);
            dashedLine.computeLineDistances();
            dashedLine.renderOrder = 2;
            scene.add(dashedLine);
            const solidLine = new THREE.Line(geometry, material);
            solidLine.renderOrder = 3;
            scene.add(solidLine);
        }
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(12, 8, 15);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(a/2, a*Math.sqrt(3)/6, h/2);
            scene.add(new THREE.AmbientLight(0xcccccc));
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7.5);
            scene.add(directionalLight);

            // --- Occlusion Geometry ---
            const occlusionGeom = new THREE.BufferGeometry();
            const verticesOcclusion = new Float32Array([
                A.x,A.y,A.z, C.x,C.y,C.z, B.x,B.y,B.z,
                A_.x,A_.y,A_.z, B_.x,B_.y,B_.z, C_.x,C_.y,C_.z,
                A.x,A.y,A.z, B.x,B.y,B.z, B_.x,B_.y,B_.z, A.x,A.y,A.z, B_.x,B_.y,B_.z, A_.x,A_.y,A_.z,
                B.x,B.y,B.z, C.x,C.y,C.z, C_.x,C_.y,C_.z, B.x,B.y,B.z, C_.x,C_.y,C_.z, B_.x,B_.y,B_.z,
                C.x,C.y,C.z, A.x,A.y,A.z, A_.x,A_.y,A_.z, C.x,C.y,C.z, A_.x,A_.y,A_.z, C_.x,C_.y,C_.z
            ]);
            occlusionGeom.setAttribute('position', new THREE.BufferAttribute(verticesOcclusion, 3));
            occlusionGeom.computeVertexNormals();
            const occlusionMesh = new THREE.Mesh(occlusionGeom, occlusionMaterial);
            occlusionMesh.renderOrder = 0;
            scene.add(occlusionMesh);

            // --- Cross-section Trapezoid Mesh ---
            const sectionGeom = new THREE.BufferGeometry();
            const verticesSection = new Float32Array([
                M.x, M.y, M.z, N.x, N.y, N.z, J.x, J.y, J.z, I.x, I.y, I.z
            ]);
            const indices = [0, 1, 2, 0, 2, 3];
            sectionGeom.setAttribute('position', new THREE.BufferAttribute(verticesSection, 3));
            sectionGeom.setIndex(indices);
            sectionGeom.computeVertexNormals();
            const sectionMesh = new THREE.Mesh(sectionGeom, sectionMaterial);
            sectionMesh.renderOrder = 1;
            scene.add(sectionMesh);
            
            // --- Visible Geometry ---
            createPointSphere(A, 'A');
            createPointSphere(B, 'B');
            createPointSphere(C, 'C');
            createPointSphere(A_, "A'");
            createPointSphere(B_, "B'");
            createPointSphere(C_, "C'");
            
            createPointSphere(O, 'O');
            createPointSphere(I, 'I');
            createPointSphere(J, 'J');
            createPointSphere(M, 'M');
            createPointSphere(N, 'N');

            // Section edges
            addEdge(M, N, visibleBoldLineMaterial);
            addEdge(N, J, visibleBoldLineMaterial);
            addEdge(J, I, visibleBoldLineMaterial);
            addEdge(I, M, visibleBoldLineMaterial);

            // Prism edges
            addEdge(A, B, visibleSolidLineMaterial);
            addEdge(B, C, visibleSolidLineMaterial);
            addEdge(C, A, visibleSolidLineMaterial);
            addEdge(A_, B_, visibleSolidLineMaterial);
            addEdge(B_, C_, visibleSolidLineMaterial);
            addEdge(C_, A_, visibleSolidLineMaterial);
            addEdge(A, A_, visibleSolidLineMaterial);
            addEdge(B, B_, visibleSolidLineMaterial);
            addEdge(C, C_, visibleSolidLineMaterial);
        }

        function updateLabels() {
            for (const key in labels) {
                const label = labels[key];
                const vector = label.position.clone().project(camera);
                const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-vector.y * 0.5 + 0.5) * window.innerHeight;
                label.element.style.left = `${x}px`;
                label.element.style.top = `${y}px`;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateLabels();
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
        animate();
        window.addEventListener('resize', onWindowResize);
    </script>
</body>
</html>
