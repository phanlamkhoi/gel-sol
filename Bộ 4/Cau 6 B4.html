<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô hình 3D: Đường thẳng song song với Mặt phẳng</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #f0f0f0; }
        canvas { display: block; width: 100%; height: 100vh; }
        .label {
            position: absolute;
            font-size: 16px;
            color: #000000;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.75);
            padding: 2px 6px;
            border-radius: 5px;
            pointer-events: none;
            transform: translate(-50%, -50%);
            white-space: nowrap;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <script>
        let scene, camera, renderer, controls;
        let labels = {};

        // --- 1. Define Coordinates & Dimensions ---
        const planeSize = 20;
        const planeDistance = 10;

        // Plane (Q) at y=0
        const Q_center = new THREE.Vector3(0, 0, 0);
        // Plane (P) at y=planeDistance
        const P_position = new THREE.Vector3(0, planeDistance, 0);
        const P_label_position = new THREE.Vector3(-planeSize/2 + 2, planeDistance, planeSize/2 - 2); 

        // Line 'a' on plane (P)
        const a_start = new THREE.Vector3(-planeSize/2 + 2, planeDistance, -planeSize/2 + 5);
        const a_end = new THREE.Vector3(planeSize/2 - 2, planeDistance, planeSize/2 - 5);
        const a_center = new THREE.Vector3().addVectors(a_start, a_end).multiplyScalar(0.5);

        // --- 2. Materials ---
        const planeMaterial = new THREE.MeshPhongMaterial({ 
            color: 0x1E90FF, 
            side: THREE.DoubleSide, 
            opacity: 0.4, 
            transparent: true 
        });
        const lineMaterial = new THREE.LineBasicMaterial({ 
            color: 0xFF0000, 
            linewidth: 15 
        });

        // --- Helper Functions ---
        function addLabel(position, text) {
            const element = document.createElement('div');
            element.className = 'label';
            element.textContent = text;
            document.body.appendChild(element);
            labels[text] = { element: element, position: position };
        }
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(15, 15, 20);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0, planeDistance/2, 0);
            scene.add(new THREE.AmbientLight(0xdddddd));
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight.position.set(10, 20, 15);
            scene.add(directionalLight);

            // --- Create Geometry ---
            const planeGeom = new THREE.PlaneGeometry(planeSize, planeSize);
            
            // Create Plane (Q)
            const planeQ = new THREE.Mesh(planeGeom, planeMaterial);
            planeQ.rotation.x = -Math.PI / 2;
            planeQ.position.copy(Q_center);
            scene.add(planeQ);

            // Create Plane (P)
            const planeP = new THREE.Mesh(planeGeom, planeMaterial);
            planeP.rotation.x = -Math.PI / 2;
            planeP.position.copy(P_position);
            scene.add(planeP);

            // Create Line 'a'
            const linePoints = [a_start, a_end];
            const lineGeom = new THREE.BufferGeometry().setFromPoints(linePoints);
            const lineA = new THREE.Line(lineGeom, lineMaterial);
            scene.add(lineA);
            
            // Add Labels
            addLabel(P_label_position, "(P)");
            addLabel(Q_center, "(Q)");
            addLabel(a_center, "a");
        }

        function updateLabels() {
            for (const key in labels) {
                const label = labels[key];
                const vector = label.position.clone().project(camera);
                const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-vector.y * 0.5 + 0.5) * window.innerHeight;
                label.element.style.left = `${x}px`;
                label.element.style.top = `${y}px`;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateLabels();
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
        animate();
        window.addEventListener('resize', onWindowResize);
    </script>
</body>
</html>
