<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô hình 3D: Góc giữa AC và B'D'</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #f0f0f0; }
        canvas { display: block; width: 100%; height: 100vh; }
        .label {
            position: absolute;
            font-size: 16px;
            color: #000000;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.75);
            padding: 2px 6px;
            border-radius: 5px;
            pointer-events: none;
            transform: translate(-50%, -50%);
            white-space: nowrap;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <script>
        let scene, camera, renderer, controls;
        let labels = {};

        // --- 1. Define Coordinates (side length a = 10) ---
        const a = 10;
        const A = new THREE.Vector3(0, 0, 0);
        const B = new THREE.Vector3(a, 0, 0);
        const D = new THREE.Vector3(0, a, 0);
        const A_ = new THREE.Vector3(0, 0, a);
        
        const C = new THREE.Vector3(a, a, 0);
        const B_ = new THREE.Vector3(a, 0, a);
        const D_ = new THREE.Vector3(0, a, a);
        const C_ = new THREE.Vector3(a, a, a);

        // --- 2. Materials ---
        const pointMaterial = new THREE.MeshBasicMaterial({ color: 0x333333 });
        const occlusionMaterial = new THREE.MeshPhongMaterial({ color: 0xFFFFFF, side: THREE.DoubleSide, colorWrite: false, depthWrite: true });
        const hiddenDashedLineMaterial = new THREE.LineDashedMaterial({ color: 0x444444, linewidth: 5, dashSize: 1, gapSize: 1, depthWrite: false, depthFunc: THREE.GreaterEqualDepth });
        
        const visibleSolidLineMaterial = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 7, depthFunc: THREE.LessEqualDepth });
        const visibleRedBoldLineMaterial = new THREE.LineBasicMaterial({ color: 0xFF0000, linewidth: 15, depthFunc: THREE.LessEqualDepth });
        const visibleBlueBoldLineMaterial = new THREE.LineBasicMaterial({ color: 0x0000FF, linewidth: 15, depthFunc: THREE.LessEqualDepth });

        // --- Helper Functions ---
        function addLabel(position, text) {
            const element = document.createElement('div');
            element.className = 'label';
            element.textContent = text;
            document.body.appendChild(element);
            labels[text] = { element: element, position: position };
        }

        function createPointSphere(position, labelText) {
            const geometry = new THREE.SphereGeometry(0.2, 16, 16);
            const sphere = new THREE.Mesh(geometry, pointMaterial);
            sphere.position.copy(position);
            scene.add(sphere);
            addLabel(position, labelText);
        }

        function addEdge(v1, v2, material) {
            const points = [v1, v2];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const dashedLine = new THREE.Line(geometry, hiddenDashedLineMaterial);
            dashedLine.computeLineDistances();
            dashedLine.renderOrder = 1;
            scene.add(dashedLine);
            const solidLine = new THREE.Line(geometry, material);
            solidLine.renderOrder = 2;
            scene.add(solidLine);
        }
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(12, 12, 15);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(a/2, a/2, a/2);
            scene.add(new THREE.AmbientLight(0xcccccc));
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7.5);
            scene.add(directionalLight);

            // --- Occlusion Geometry (6 faces of the cube) ---
            const occlusionGeom = new THREE.BufferGeometry();
            const vertices = new Float32Array([
                // Bottom
                A.x,A.y,A.z, B.x,B.y,B.z, C.x,C.y,C.z, A.x,A.y,A.z, C.x,C.y,C.z, D.x,D.y,D.z,
                // Top
                A_.x,A_.y,A_.z, D_.x,D_.y,D_.z, C_.x,C_.y,C_.z, A_.x,A_.y,A_.z, C_.x,C_.y,C_.z, B_.x,B_.y,B_.z,
                // Front
                A.x,A.y,A.z, B.x,B.y,B.z, B_.x,B_.y,B_.z, A.x,A.y,A.z, B_.x,B_.y,B_.z, A_.x,A_.y,A_.z,
                // Back
                D.x,D.y,D.z, C.x,C.y,C.z, C_.x,C_.y,C_.z, D.x,D.y,D.z, C_.x,C_.y,C_.z, D_.x,D_.y,D_.z,
                // Left
                A.x,A.y,A.z, D.x,D.y,D.z, D_.x,D_.y,D_.z, A.x,A.y,A.z, D_.x,D_.y,D_.z, A_.x,A_.y,A_.z,
                // Right
                B.x,B.y,B.z, C.x,C.y,C.z, C_.x,C_.y,C_.z, B.x,B.y,B.z, C_.x,C_.y,C_.z, B_.x,B_.y,B_.z,
            ]);
            occlusionGeom.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            occlusionGeom.computeVertexNormals();
            const occlusionMesh = new THREE.Mesh(occlusionGeom, occlusionMaterial);
            occlusionMesh.renderOrder = 0;
            scene.add(occlusionMesh);
            
            // --- Visible Geometry ---
            createPointSphere(A, 'A');
            createPointSphere(B, 'B');
            createPointSphere(C, 'C');
            createPointSphere(D, 'D');
            createPointSphere(A_, "A'");
            createPointSphere(B_, "B'");
            createPointSphere(C_, "C'");
            createPointSphere(D_, "D'");

            // Highlighted diagonals
            addEdge(A, C, visibleRedBoldLineMaterial);    // Main diagonal
            addEdge(B_, D_, visibleRedBoldLineMaterial); // Main diagonal
            addEdge(B, D, visibleBlueBoldLineMaterial);   // Auxiliary diagonal

            // Cube edges
            addEdge(A, B, visibleSolidLineMaterial);
            addEdge(A, D, visibleSolidLineMaterial);
            addEdge(A, A_, visibleSolidLineMaterial);
            addEdge(B, C, visibleSolidLineMaterial);
            addEdge(B, B_, visibleSolidLineMaterial);
            addEdge(C, D, visibleSolidLineMaterial);
            addEdge(C, C_, visibleSolidLineMaterial);
            addEdge(D, D_, visibleSolidLineMaterial);
            addEdge(A_, B_, visibleSolidLineMaterial);
            addEdge(A_, D_, visibleSolidLineMaterial);
            addEdge(B_, C_, visibleSolidLineMaterial);
            addEdge(C_, D_, visibleSolidLineMaterial);
        }

        function updateLabels() {
            for (const key in labels) {
                const label = labels[key];
                const vector = label.position.clone().project(camera);
                const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-vector.y * 0.5 + 0.5) * window.innerHeight;
                label.element.style.left = `${x}px`;
                label.element.style.top = `${y}px`;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateLabels();
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
        animate();
        window.addEventListener('resize', onWindowResize);
    </script>
</body>
</html>
