<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô hình 3D: Hình Lăng Trụ</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #f0f0f0; }
        canvas { display: block; width: 100%; height: 100vh; }
        .label {
            position: absolute;
            font-size: 16px;
            color: #000000;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.75);
            padding: 2px 6px;
            border-radius: 5px;
            pointer-events: none;
            transform: translate(-50%, -50%);
            white-space: nowrap;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <script>
        let scene, camera, renderer, controls;
        let labels = {};

        // --- 1. Define Coordinates ---
        const h = 12; // Height of the prism
        const A = new THREE.Vector3(0, 0, 0);
        const B = new THREE.Vector3(10, 0, 0);
        const C = new THREE.Vector3(5, 0, 8);

        const A_ = new THREE.Vector3(2, h, 2); // Creating an oblique prism
        const B_ = new THREE.Vector3(12, h, 2);
        const C_ = new THREE.Vector3(7, h, 10);

        // --- 2. Materials ---
        const pointMaterial = new THREE.MeshBasicMaterial({ color: 0x333333 });
        const occlusionMaterial = new THREE.MeshPhongMaterial({ color: 0xFFFFFF, side: THREE.DoubleSide, colorWrite: false, depthWrite: true });
        const hiddenDashedLineMaterial = new THREE.LineDashedMaterial({ color: 0x444444, linewidth: 5, dashSize: 1, gapSize: 1, depthWrite: false, depthFunc: THREE.GreaterEqualDepth });
        
        const visibleSolidLineMaterial = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 7, depthFunc: THREE.LessEqualDepth });
        const visibleBoldLineMaterial = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 15, depthFunc: THREE.LessEqualDepth }); // Bold for lateral edges

        // --- Helper Functions ---
        function addLabel(position, text) {
            const element = document.createElement('div');
            element.className = 'label';
            element.textContent = text;
            document.body.appendChild(element);
            labels[text] = { element: element, position: position };
        }

        function createPointSphere(position, labelText) {
            const geometry = new THREE.SphereGeometry(0.3, 16, 16);
            const sphere = new THREE.Mesh(geometry, pointMaterial);
            sphere.position.copy(position);
            scene.add(sphere);
            addLabel(position, labelText);
        }

        function addEdge(v1, v2, material) {
            const points = [v1, v2];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const dashedLine = new THREE.Line(geometry, hiddenDashedLineMaterial);
            dashedLine.computeLineDistances();
            dashedLine.renderOrder = 1;
            scene.add(dashedLine);
            const solidLine = new THREE.Line(geometry, material);
            solidLine.renderOrder = 2;
            scene.add(solidLine);
        }
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(15, 12, 20);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(6, h/2, 5);
            scene.add(new THREE.AmbientLight(0xcccccc));
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7.5);
            scene.add(directionalLight);

            // --- Occlusion Geometry ---
            const occlusionGeom = new THREE.BufferGeometry();
            occlusionGeom.setFromPoints([A,B,C,A_,B_,C_]);
            occlusionGeom.setIndex([0,1,2, 3,5,4, 0,3,4, 0,4,1, 1,4,5, 1,5,2, 2,5,3, 2,3,0]);
            occlusionGeom.computeVertexNormals();
            const occlusionMesh = new THREE.Mesh(occlusionGeom, occlusionMaterial);
            occlusionMesh.renderOrder = 0;
            scene.add(occlusionMesh);
            
            // --- Visible Geometry ---
            createPointSphere(A, 'A');
            createPointSphere(B, 'B');
            createPointSphere(C, 'C');
            createPointSphere(A_, "A'");
            createPointSphere(B_, "B'");
            createPointSphere(C_, "C'");

            // Lateral edges (bold)
            addEdge(A, A_, visibleBoldLineMaterial);
            addEdge(B, B_, visibleBoldLineMaterial);
            addEdge(C, C_, visibleBoldLineMaterial);
            
            // Base edges
            addEdge(A, B, visibleSolidLineMaterial);
            addEdge(B, C, visibleSolidLineMaterial);
            addEdge(C, A, visibleSolidLineMaterial);
            addEdge(A_, B_, visibleSolidLineMaterial);
            addEdge(B_, C_, visibleSolidLineMaterial);
            addEdge(C_, A_, visibleSolidLineMaterial);
        }

        function updateLabels() {
            for (const key in labels) {
                const label = labels[key];
                const vector = label.position.clone().project(camera);
                const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-vector.y * 0.5 + 0.5) * window.innerHeight;
                label.element.style.left = `${x}px`;
                label.element.style.top = `${y}px`;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateLabels();
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
        animate();
        window.addEventListener('resize', onWindowResize);
    </script>
</body>
</html>
